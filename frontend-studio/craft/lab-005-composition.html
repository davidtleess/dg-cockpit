<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lab-005 — composition: mass, ground, identity</title>
<!--
  CRAFT LAB, not a proposal. Practising the three channels composition-profile.mjs found
  missing from every surface this studio has shipped:

    block mass      biggest/median block was 1.0 on 017 and 018. Category: 5.5x - 91.5x.
    figure/ground   0 layers on mine. The product SHIPS three (--dg-bg / surface / raised)
                    and every Studio page has used exactly one, separating with hairlines.
    identity        0 imagery nodes on mine. Savant 26, FotMob 35, Sofascore 36.

  Type scale is deliberately NOT the lever: measured at 1.38 on my pages against Sofascore's
  1.29 and FotMob's 1.36, it was already inside the category's range. One exception is
  declared below and costed.

  Architecture is SGX's bite / snack / meal, which names exactly how 018 failed - it was
  all meal. Bite = the headline count. Snack = the depth chart. Meal = the table.
-->
<style>
  :root{
    /* All three ground layers, as shipped by the product. */
    --bg:oklch(0.16 0.01 250); --surface:oklch(0.20 0.012 250); --raised:oklch(0.24 0.014 250);
    --border:oklch(0.32 0.012 250); --border-strong:oklch(0.48 0.014 250);
    --text:oklch(0.92 0.005 250); --muted:oklch(0.68 0.008 250); --faint:oklch(0.52 0.010 250);
    --model:oklch(0.72 0.11 255); --market:oklch(0.76 0.13 75);
    --display:"Archivo","Archivo Narrow",system-ui,sans-serif;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sm:13px; --base:15px; --lg:18px;
    /* DECLARED EXTENSION, costed in the pane: the product ships no display scale above
       18px. The Bite needs one number carrying the whole page, which is the single
       clearest thing Savant does (type contrast 3.43 against this studio's 1.38). */
    --display-xl:76px; --display-md:30px;
    --r:6px;   /* the product's largest shipped radius. NOT raised to the category's 12-16. */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:var(--base);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 64px}
  .kicker{font-family:var(--mono);font-size:var(--sm);letter-spacing:.08em;text-transform:uppercase;
          color:var(--muted);margin:0 0 14px}

  /* ── BENTO: tile area encodes importance. This is the channel that was missing. ── */
  .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
  .t-bite{grid-column:span 7}
  .t-side{grid-column:span 5;display:grid;gap:14px;align-content:start}
  .t-chart{grid-column:span 12}
  .t-meal{grid-column:span 12;background:transparent;border:0;padding:0}
  @media (max-width:880px){.t-bite,.t-side{grid-column:span 12}}

  /* ── the Bite ── */
  .bite{display:flex;gap:22px;align-items:flex-start}
  .bignum{font-family:var(--display);font-size:var(--display-xl);font-weight:700;line-height:.86;
          letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .bignum .of{font-size:var(--display-md);color:var(--faint);font-weight:600}
  .bite h1{font-family:var(--display);font-size:var(--lg);font-weight:650;margin:0 0 8px;
           line-height:1.3;letter-spacing:-.01em}
  .bite p{margin:0;color:var(--muted);font-size:var(--sm);max-width:46ch}

  /* ── supporting tiles, deliberately smaller mass ── */
  .stat{background:var(--raised);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
  .stat .k{font-size:var(--sm);color:var(--muted);margin:0 0 4px}
  .stat .v{font-family:var(--display);font-size:var(--display-md);font-weight:650;line-height:1;
           font-variant-numeric:tabular-nums}
  .stat .v small{font-size:var(--sm);color:var(--faint);font-weight:400;font-family:var(--sans)}

  /* ── the signature: a depth chart. Vertical position = the size of the job the TAPE says
        he had, not where the team lists him. ── */
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
              flex-wrap:wrap;margin:0 0 4px}
  .chart-head h2{font-family:var(--display);font-size:var(--lg);font-weight:650;margin:0}
  .chart-head .note{color:var(--muted);font-size:var(--sm)}
  .columns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:14px}
  @media (max-width:880px){.columns{grid-template-columns:1fr}}
  .col{position:relative;background:var(--raised);border-radius:var(--r);padding:12px 12px 10px}
  .col > h3{font-family:var(--display);font-size:var(--base);font-weight:650;margin:0 0 2px}
  .col .sub{font-size:var(--sm);color:var(--muted);margin:0 0 10px}
  .slot{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:4px}
  .slot.has-job{background:oklch(0.30 0.014 250)}
  /* IDENTITY as mass: a team-coloured tile carrying the player's initials. Not a photo —
     the app's headshot cache is absent and requests 404 — but it is the same channel the
     category uses crests for: a coloured object you recognise before you read. */
  .id{width:34px;height:34px;border-radius:4px;flex:none;display:grid;place-items:center;
      font-family:var(--display);font-weight:700;font-size:var(--sm);letter-spacing:-.02em;
      color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
  .who{min-width:0;flex:1}
  .who .n{font-size:var(--sm);font-weight:600;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
  .who .m{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  .role{font-family:var(--mono);font-size:var(--sm);font-weight:600;font-variant-numeric:tabular-nums}
  .cutline{display:flex;align-items:center;gap:8px;margin:8px 0 6px}
  .cutline .rule{flex:1;border-top:1px dashed var(--border-strong)}
  .cutline .lab{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
  .partial .n{color:var(--muted)} .partial .id{opacity:.55}

  /* ── the Meal: present, quiet, small. On 018 this WAS the page. ── */
  details.meal{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
  details.meal summary{cursor:pointer;font-size:var(--sm);color:var(--muted);font-family:var(--mono)}
  details.meal summary:focus-visible{outline:2px solid var(--model);outline-offset:3px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:5px 8px}
  th.num,td.num{text-align:right}
  td{padding:4px 8px;font-size:var(--sm);border-top:1px solid var(--border)}
  td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  footer{margin-top:22px;color:var(--faint);font-family:var(--mono);font-size:12px;line-height:1.7}
  #fault{display:none;border:2px solid var(--text);border-radius:var(--r);padding:16px;margin:16px 0;
         background:var(--surface)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="fault" role="alert"><b>This page failed to draw — a fault, not an empty result.</b>
    <div id="faultmsg" style="font-family:var(--mono);font-size:13px;margin-top:8px"></div></div>
  <div id="app"></div>
</div>
<script type="module">
const fault=(e)=>{document.getElementById('fault').style.display='block';
  document.getElementById('faultmsg').textContent=String(e&&e.stack||e);console.error(e)};
let META,PLAYERS;
try{({META,PLAYERS}=await import('../proposals/018-what-repeats/data.js?v='+Date.now()));}
catch(e){fault(e);throw e}

// NFL primary colours, chosen for legibility ON A DARK GROUND — several teams' true
// primaries are navies that vanish here, so the brighter of the pair is used and the
// choice is stated rather than passed off as the official colour.
const TEAM={CHI:'#C83803',NYJ:'#1C8B5B',NE:'#C60C30',LV:'#B4B8BB',JAX:'#22909F',DEN:'#FB4F14',
  TEN:'#4B92DB',CAR:'#0085CA',SEA:'#69BE28',NYG:'#3B62C4',GB:'#FFB612',BAL:'#7B5CD6',
  LAC:'#0080C6'};
const initials=(n)=>n.split(/\s+/).filter(w=>!/^(jr|sr|ii|iii|iv)\.?$/i.test(w))
  .slice(0,2).map(w=>w[0]).join('');
const $=(t,a={},...k)=>{const e=document.createElement(t);
  for(const[p,v]of Object.entries(a)){if(v==null)continue;p==='html'?e.innerHTML=v:e.setAttribute(p,v)}
  for(const c of k.flat())if(c!=null)e.append(c);return e};

try{
const cuts=META.starterCuts, app=document.getElementById('app');
const POS=[['RB','Running backs'],['WR','Receivers'],['TE','Tight ends']];
const full=PLAYERS.filter(p=>p.tier==='full');
const withJob=full.filter(p=>p.role>=cuts[p.pos]);
// The count and the drawing must agree. Garrett Wilson clears the line on 7 games, so he
// appears above it in the column while sitting outside a count of FULL seasons — the
// headline and the picture would contradict each other unless he is named explicitly.
const partialAbove=PLAYERS.filter(p=>p.tier==='partial'&&p.role>=cuts[p.pos]);

app.append($('p',{class:'kicker'},'2025 tape · expected fantasy points · nflverse · your roster'));

const bento=$('div',{class:'bento'});

// ── BITE ─────────────────────────────────────────────────────────────────────────
bento.append($('div',{class:'tile t-bite'},
  $('div',{class:'bite'},
    $('div',{class:'bignum',html:`${withJob.length}<span class="of">/${full.length}</span>`}),
    $('div',{},
      $('h1',{},`${['Zero','One','Two','Three','Four','Five'][withJob.length]||withJob.length} `
        +`of your players had a weekly starter’s job last season.`),
      $('p',{},`The other ${full.length-withJob.length} had a jersey. A “job” here is the `
        +`workload of the 36th-best receiver, 24th back or 12th tight end by what his targets `
        +`and carries were worth — the line a 12-team superflex league starts.`
        +(partialAbove.length?` ${partialAbove.map(p=>p.name).join(' and ')} `
          +`${partialAbove.length>1?'were':'was'} above it too, but in `
          +`${partialAbove.map(p=>p.games).join(' and ')} games — drawn above the line below, `
          +`and left out of this count.`:'')))))); 

// ── supporting tiles: smaller mass on purpose ────────────────────────────────────
const side=$('div',{class:'t-side'});
const tes=full.filter(p=>p.pos==='TE');
side.append(
  $('div',{class:'stat'},$('p',{class:'k'},'Your biggest job'),
    $('div',{class:'v'},'14.6',$('small',{},' pts/g · Ashton Jeanty'))),
  $('div',{class:'stat'},$('p',{class:'k'},'Tight ends above the starter line'),
    $('div',{class:'v'},String(PLAYERS.filter(p=>p.pos==='TE'&&p.role>=cuts.TE).length),
      $('small',{},` of ${PLAYERS.filter(p=>p.pos==='TE').length} with tape · the room with no job in it`))),
  $('div',{class:'stat'},$('p',{class:'k'},'Players with no 2025 tape at all'),
    $('div',{class:'v'},'4',$('small',{},' · not measured, not judged'))));
bento.append(side);

// ── SIGNATURE: the depth chart ───────────────────────────────────────────────────
const chart=$('div',{class:'tile t-chart'});
chart.append($('div',{class:'chart-head'},
  $('h2',{},'Where the tape puts them'),
  $('span',{class:'note'},'Stacked by what his targets and carries were worth per game — '
    +'not by where the team lists him. The dashed line is a weekly starter’s workload.')));
chart.append($('p',{class:'sub',style:'margin:6px 0 0;color:var(--muted);font-size:var(--sm)'},
  `Column height is the roster, not the layout: you hold `
  +POS.map(([pos,l])=>`${PLAYERS.filter(p=>p.pos===pos).length} ${l.toLowerCase()}`).join(', ')
  +`. The short columns are the rooms, not empty space.`));
const cols=$('div',{class:'columns'});
for(const [pos,label] of POS){
  const grp=PLAYERS.filter(p=>p.pos===pos).sort((a,b)=>b.role-a.role);
  const above=grp.filter(p=>p.role>=cuts[pos]), below=grp.filter(p=>p.role<cuts[pos]);
  const col=$('div',{class:'col'},
    $('h3',{},label),
    $('p',{class:'sub'},`starter’s job = ${cuts[pos]} pts/g`));
  const slot=(p)=>$('div',{class:'slot'+(p.role>=cuts[p.pos]?' has-job':'')
      +(p.tier==='partial'?' partial':'')},
    $('div',{class:'id',style:`background:${TEAM[p.team]||'#5A6472'}`},initials(p.name)),
    $('div',{class:'who'},$('div',{class:'n'},p.name),
      $('div',{class:'m'},`${p.team||'—'} · ${p.age??'—'} · yr ${p.exp??'—'}`
        +(p.tier==='partial'?` · ${p.games}g`:''))),
    $('div',{class:'role'},p.role.toFixed(1)));
  above.forEach(p=>col.append(slot(p)));
  col.append($('div',{class:'cutline'},$('span',{class:'rule'}),
    $('span',{class:'lab'},`${cuts[pos]} — a weekly starter`),$('span',{class:'rule'})));
  below.forEach(p=>col.append(slot(p)));
  cols.append(col);
}
chart.append(cols);
bento.append(chart);

// ── MEAL: available, quiet, closed by default ────────────────────────────────────
const meal=$('details',{class:'meal'},$('summary',{},'every number behind this →'));
const tb=$('tbody',{});
for(const p of [...PLAYERS].sort((a,b)=>b.role-a.role))
  tb.append($('tr',{},$('td',{},p.name),$('td',{class:'mono'},p.pos),
    $('td',{class:'mono num'},p.role.toFixed(1)),$('td',{class:'mono num'},p.prod.toFixed(1)),
    $('td',{class:'mono num'},(p.prod-p.role>=0?'+':'−')+Math.abs(p.prod-p.role).toFixed(2)),
    $('td',{class:'mono num'},p.games+'g'),
    $('td',{class:'mono num'},p.mktValue?Math.round(p.mktValue).toLocaleString():'—')));
meal.append($('table',{},$('thead',{},$('tr',{},
  ...['Player','Pos'].map(h=>$('th',{},h)),
  ...['The job','Scored','vs job','Games','Market'].map(h=>$('th',{class:'num'},h)))),tb));
bento.append($('div',{class:'t-meal'},meal));

app.append(bento);
app.append($('footer',{},`tape: nflverse ff_opportunity 2025, PPR · market FantasyCalc `
  +`${META.marketCapture} · roster snapshot ${META.snapshot.slice(0,10)} · `
  +`team colours are the brighter of each club's pair, chosen to read on a dark ground`));
}catch(e){fault(e)}
</script>
</body>
</html>
