<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The job, not the season — Dynasty Genius / Studio 017</title>
<style>
  :root{
    /* generated from the product: kit/studio-kit.tokens.json (dark) */
    --dg-bg:oklch(0.16 0.01 250); --dg-surface:oklch(0.2 0.012 250); --dg-surface-raised:oklch(0.24 0.014 250);
    --dg-border:oklch(0.32 0.012 250); --dg-border-strong:oklch(0.48 0.014 250);
    --dg-text:oklch(0.92 0.005 250); --dg-text-muted:oklch(0.68 0.008 250);
    --dg-focus:oklch(0.72 0.14 255); --dg-caveat:oklch(0.72 0.14 72);
    --dg-model:oklch(0.72 0.11 255); --dg-market:oklch(0.76 0.13 75);
    --dg-font-display:"Archivo","Archivo Narrow",system-ui,sans-serif;
    --dg-font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --dg-font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
    --dg-text-sm:0.8125rem; --dg-text-base:0.9375rem; --dg-text-lg:1.125rem;
    --dg-space-1:0.25rem; --dg-space-2:0.5rem; --dg-space-3:0.75rem; --dg-space-4:1rem;
    /* the tape is drawn in ink. it is not an opinion, so it gets no hue. */
    --tape:oklch(0.80 0.006 250); --tape-soft:oklch(0.52 0.010 250);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--dg-bg);color:var(--dg-text);
       font-family:var(--dg-font-sans);font-size:var(--dg-text-base);line-height:1.5;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:var(--dg-space-4) var(--dg-space-4) 64px}
  a{color:inherit}

  /* ── masthead: kicker / concept title / decoder / highlight rule ── */
  .kicker{font-family:var(--dg-font-mono);font-size:var(--dg-text-sm);letter-spacing:.08em;
          text-transform:uppercase;color:var(--dg-text-muted);margin:8px 0 10px}
  h1{font-family:var(--dg-font-display);font-size:var(--dg-text-lg);font-weight:650;
     letter-spacing:-.01em;margin:0 0 10px;max-width:56ch;line-height:1.35}
  h1 .who{border-bottom:2px solid var(--tape);padding-bottom:1px}
  .decoder{color:var(--dg-text-muted);max-width:74ch;margin:0 0 6px;font-size:var(--dg-text-sm)}
  .rule-out-loud{color:var(--dg-text-muted);max-width:74ch;margin:0;font-size:var(--dg-text-sm)}
  .rule-out-loud b{color:var(--dg-text);font-weight:600}
  hr.sep{border:0;border-top:1px solid var(--dg-border);margin:20px 0}

  /* ── hero figure ── */
  .hero{background:var(--dg-surface);border:1px solid var(--dg-border);border-radius:6px;
        padding:var(--dg-space-4);margin:0 0 20px}
  .hero-head{display:flex;flex-wrap:wrap;gap:var(--dg-space-3);align-items:baseline;
             justify-content:space-between;margin-bottom:2px}
  .hero-name{font-family:var(--dg-font-display);font-size:var(--dg-text-lg);font-weight:650}
  .hero-sub{color:var(--dg-text-muted);font-size:var(--dg-text-sm)}
  .hero-claim{font-size:var(--dg-text-base);max-width:82ch;margin:6px 0 4px}
  .hero svg{display:block;width:100%;height:auto;overflow:visible}

  /* ── opinion chips: the ONLY colour on the page ── */
  .ops{display:flex;gap:var(--dg-space-3);flex-wrap:wrap;align-items:center}
  .op{display:inline-flex;align-items:center;gap:6px;font-size:var(--dg-text-sm);
      font-family:var(--dg-font-mono);white-space:nowrap}
  .op .dot{width:9px;height:9px;border-radius:999px;flex:none}
  .op.market .dot{background:var(--dg-market)} .op.model .dot{background:var(--dg-model)}
  .op .k{color:var(--dg-text-muted)}

  /* ── small multiples ── */
  .grid-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
             flex-wrap:wrap;margin:0 0 8px}
  h2{font-family:var(--dg-font-display);font-size:var(--dg-text-base);font-weight:650;margin:0}
  .grid-head .note{color:var(--dg-text-muted);font-size:var(--dg-text-sm)}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:var(--dg-text-sm);font-weight:600;color:var(--dg-text-muted);text-align:left;
           padding:6px 10px;border-bottom:1px solid var(--dg-border);white-space:nowrap}
  thead th.num,tbody td.num{text-align:right}
  tbody td{padding:5px 10px;border-bottom:1px solid var(--dg-border);vertical-align:middle}
  tbody tr:hover{background:var(--dg-surface)}
  .pname{font-weight:600;font-size:var(--dg-text-base);white-space:nowrap}
  .pmeta{color:var(--dg-text-muted);font-size:var(--dg-text-sm);font-family:var(--dg-font-mono);
         white-space:nowrap}
  td.spark{width:236px;padding:2px 10px} td.spark svg{display:block;overflow:visible}
  .rolechg{font-family:var(--dg-font-mono);font-size:var(--dg-text-sm);white-space:nowrap}
  .rolechg .arrow{color:var(--dg-text-muted);padding:0 3px}
  .rolechg .to{color:var(--dg-text);font-weight:600}
  .pct{font-family:var(--dg-font-mono);font-size:var(--dg-text-sm);color:var(--dg-text-muted);
       white-space:nowrap}
  .pct.hi,.pct.lo{color:var(--dg-text);font-weight:600}
  /* Numbers wear text ink. Identity lives in the column header, where one dot carries the
     lane hue — hue on a number a header already names is decoration, not encoding. */
  .mval,.dvs{font-family:var(--dg-font-mono);font-size:var(--dg-text-sm);color:var(--dg-text);white-space:nowrap}
  th .lane{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;vertical-align:1px}
  th .lane.market{background:var(--dg-market)} th .lane.model{background:var(--dg-model)}
  tr.flag td,tr.flag-down td{background:color-mix(in oklab,var(--dg-surface-raised) 70%,transparent)}
  tr.flag .pname::before,tr.flag-down .pname::before{content:"";display:inline-block;width:3px;height:13px;
    background:var(--tape);margin-right:7px;vertical-align:-2px;border-radius:1px}
  tr.band td{padding:16px 10px 5px;border-bottom:1px solid var(--dg-border)}
  tr.band span{font-size:var(--dg-text-sm);color:var(--dg-text-muted)}
  tr.band .n{float:right;font-family:var(--dg-font-mono)}
  tr.partial .pname,tr.partial .pmeta{opacity:.82}
  td.why{font-size:var(--dg-text-sm);color:var(--dg-text-muted);font-family:var(--dg-font-mono)}

  /* ── absence: rendered as missing, never as zero ── */
  .absent{margin:20px 0 0;background:var(--dg-surface);border:1px solid var(--dg-border);
          border-radius:6px;padding:var(--dg-space-3) var(--dg-space-4)}
  .absent h3{font-family:var(--dg-font-display);font-size:var(--dg-text-base);font-weight:650;margin:0 0 4px}
  .absent p{margin:0 0 8px;color:var(--dg-text-muted);font-size:var(--dg-text-sm);max-width:78ch}
  .absent ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px}
  .absent li{font-size:var(--dg-text-sm);font-family:var(--dg-font-mono);color:var(--dg-text);
             border:1px dashed var(--dg-border-strong);border-radius:4px;padding:2px 8px}
  .absent li span{color:var(--dg-text-muted)}

  .refusal{margin:16px 0 0;color:var(--dg-text-muted);font-size:var(--dg-text-sm);max-width:82ch}
  .refusal b{color:var(--dg-text);font-weight:600}
  footer{margin-top:22px;padding-top:12px;border-top:1px solid var(--dg-border);
         color:var(--dg-text-muted);font-size:var(--dg-text-sm);font-family:var(--dg-font-mono)}

  /* tooltip */
  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;z-index:9;
       background:var(--dg-surface-raised);border:1px solid var(--dg-border-strong);border-radius:4px;
       padding:6px 9px;font-size:var(--dg-text-sm);font-family:var(--dg-font-mono);
       color:var(--dg-text);white-space:nowrap;box-shadow:none}
  :focus-visible{outline:2px solid var(--dg-focus);outline-offset:2px}

  @media (prefers-reduced-motion:no-preference){
    .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 900ms cubic-bezier(.2,0,0,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  }
  /* Wide content scrolls inside its own container. The page body never scrolls sideways. */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tscroll table{min-width:760px}
  @media (max-width:820px){ .wrap{padding:12px 12px 48px} }
</style>
</head>
<body>
<div class="wrap">

  <p class="kicker" id="kicker">2025 season · expected fantasy points · nflverse</p>
  <h1 id="headline"></h1>
  <p class="decoder" id="decoder"></p>
  <p class="rule-out-loud" id="highlightrule"></p>

  <hr class="sep">

  <section class="hero" id="hero" aria-labelledby="heroName"></section>

  <div class="grid-head">
    <h2 id="gridTitle"></h2>
    <p class="note" id="gridNote"></p>
  </div>
  <div class="tscroll" tabindex="0" role="region" aria-label="Weekly role for every player, scrollable">
  <table id="tbl">
    <thead><tr>
      <th scope="col">Player</th>
      <th scope="col">Weekly role, 2025 (expected pts/game)</th>
      <th scope="col">Started&nbsp;→&nbsp;finished</th>
      <th scope="col" class="num">Change</th>
      <th scope="col" class="num">League %ile</th>
      <th scope="col" class="num"><span class="lane market" aria-hidden="true"></span>Market</th>
      <th scope="col" class="num"><span class="lane model" aria-hidden="true"></span>Our model</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  </div>

  <section class="absent" id="absent"></section>
  <p class="refusal" id="refusal"></p>
  <footer id="prov"></footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script type="module">
const $ = s => document.querySelector(s);

// A blank page is the worst failure mode a surface can have: it looks like nothing is
// wrong AND like nothing is there. If anything below throws, say so on the page.
function fail(e){
  document.querySelector('.wrap').innerHTML =
    `<p class="kicker">017 — the job, not the season</p>
     <h1>This page failed to draw.</h1>
     <p class="decoder">Not an empty result — a fault. Reload with a hard refresh
       (Cmd-Shift-R). If it persists, the error was:</p>
     <pre style="color:var(--dg-caveat);font-family:var(--dg-font-mono);font-size:var(--dg-text-sm);
        white-space:pre-wrap;border:1px solid var(--dg-border);border-radius:4px;padding:12px">${
        String(e && e.stack || e)}</pre>`;
  throw e;
}

// Cache-bust the data import. A stale data.js against a fresh page throws on the first
// field the old file does not carry — which is exactly how this went blank on David.
let META, PLAYERS;
try {
  ({META, PLAYERS} = await import(`./data.js?v=${Date.now()}`));
} catch (e) { fail(e); }

try {
const fmt1 = v => v.toFixed(1);
const CUT = META.starterCuts;
const WK_MIN = 1, WK_MAX = 18, Y_MAX = 24;

/* ── who is in the figure ───────────────────────────────────────────────
   QBs are deliberately excluded: quarterback expected points live on a
   different scale (a QB's median role is 15.3/g against a receiver's 7.0),
   and in this room price and role already agree 1-2-3-4. Nothing to show. */
const MIN_G = 10;                       // games needed before a trajectory is honest
const skill = p => p.pos !== 'QB';

const withTape = PLAYERS.filter(p => skill(p) && p.roleChange !== undefined)
                        .sort((a,b) => b.roleChange - a.roleChange);
const shortSeason = PLAYERS.filter(p => skill(p) && p.roleChange === undefined && p.weeks.length > 0)
                           .sort((a,b) => b.weeks.length - a.weeks.length);
const noTape = PLAYERS.filter(p => skill(p) && p.weeks.length === 0);
const qbs    = PLAYERS.filter(p => !skill(p));

const risers  = withTape.filter(p => p.roleChangePctile >= 0.95);
const fallers = withTape.filter(p => p.roleChangePctile <= 0.10);
const hero    = risers[0];

// What a week's role was actually made of. Receivers are a target story, backs a carry
// story, so the string follows the position rather than printing empty fields.
const ingredients = g => {
  const bits = [];
  if (g.tgt) bits.push(`${g.tgt} target${g.tgt === 1 ? '' : 's'}`);
  if (g.car) bits.push(`${g.car} carr${g.car === 1 ? 'y' : 'ies'}`);
  if (g.air) bits.push(`${g.air} air yards`);
  return bits.length ? bits.join(', ') : 'no targets or carries';
};

const suffix = n => (n % 100 >= 11 && n % 100 <= 13) ? 'th'
              : ({1:'st', 2:'nd', 3:'rd'})[n % 10] || 'th';
const ord = n => `${n}${suffix(n)}`;

/* ── masthead ─────────────────────────────────────────────────────────── */
$('#headline').innerHTML =
  `The Jets traded for <span class="who">${hero.name}</span> in November and nearly tripled his role. ` +
  `He is the ${ordinal(marketRankInRoom(hero))}-most valuable receiver you own.`;

// The axis now names itself on the figure, so this stops repeating the unit and says why
// the unit is worth drawing at all.
$('#decoder').textContent =
  'Opportunity, not production. A player\'s role is what his targets and carries were worth at ' +
  'league-average efficiency — and it is the half of fantasy scoring that carries into next season. ' +
  'What he does on top of it mostly does not: since 2013, 74% of receivers who beat their role one ' +
  'year gave it back the next.';

$('#highlightrule').innerHTML =
  `<b>Marked below:</b> the ${risers.length} players who finished in the league's top 5% for role growth, ` +
  `and the ${fallers.length} in the bottom 10%. Measured against every player with ${MIN_G}+ games in 2025 ` +
  `(${META.populationN} of them), where the median role <em>shrank</em> ` +
  `${Math.abs(META.populationRoleChange.median).toFixed(1)} points a game.`;

/* ── hero figure ──────────────────────────────────────────────────────── */
function marketRankInRoom(p){
  const room = PLAYERS.filter(q => q.pos === p.pos && q.mktValue != null)
                      .sort((a,b) => b.mktValue - a.mktValue);
  return room.findIndex(q => q.sleeperId === p.sleeperId) + 1;
}
function ordinal(n){ return ['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth'][n] || `${n}th`; }

function heroFigure(p){
  // ML widened to seat a rotated axis label beside the tick numbers — the y-axis needs the
  // same treatment the x-axis gets from the word "week" sitting under its numbers.
  const W = 1040, H = 322, ML = 86, MR = 40, MT = 52, MB = 34;
  const iw = W - ML - MR, ih = H - MT - MB;
  const X = w => ML + (w - WK_MIN) / (WK_MAX - WK_MIN) * iw;
  const Y = v => MT + ih - (v / Y_MAX) * ih;
  const cut = CUT[p.pos];
  const anchor = META.starterAnchor[p.pos];

  // segments break wherever a week is missing — absence renders as missing, never as zero
  const segs = [];
  let cur = [];
  for (let w = WK_MIN; w <= WK_MAX; w++){
    const g = p.weeks.find(x => x.w === w);
    if (g) cur.push(g); else { if (cur.length) segs.push(cur); cur = []; }
  }
  if (cur.length) segs.push(cur);

  const oldTeam  = (p.teams2025 || []).find(t => t !== p.team) || null;
  const before   = oldTeam ? p.byTeam[oldTeam] : null;
  const after    = p.byTeam ? p.byTeam[p.team] : null;
  const firstNew = p.weeks.find(x => x.team === p.team);
  const lastOld  = [...p.weeks].reverse().find(x => x.team !== p.team);
  const gapMid   = lastOld && firstNew ? (X(lastOld.w) + X(firstNew.w)) / 2 : null;

  const path = s => s.map((g,i) => `${i?'L':'M'}${X(g.w).toFixed(1)},${Y(g.role).toFixed(1)}`).join('');
  // ticks deliberately step by 8, not 6: a gridline at 12 lands within 7px of the
  // 11.3 starter line and the two read as one doubled rule.
  const ticks = [0,8,16,24];

  return `
  <div class="hero-head">
    <div>
      <div class="hero-name" id="heroName">${p.name}</div>
      <div class="hero-sub">${p.pos} · age ${p.age} · year ${p.exp} · ${p.team}</div>
    </div>
    <div class="ops">
      <span class="op market"><span class="dot"></span><span class="k">market</span> ${p.mktValue.toLocaleString()} · ${p.pos}${p.mktPosRank}</span>
      <span class="op model"><span class="dot"></span><span class="k">our model</span> DVS ${p.dvs.toFixed(0)}</span>
    </div>
  </div>
  <p class="hero-claim">
    Across ${before.g} games at ${oldTeam} his role was worth <strong>${fmt1(before.role)}</strong> points a game.
    Across ${after.g} games at ${p.team} it was worth <strong>${fmt1(after.role)}</strong> —
    ${after.role >= cut ? "a weekly starter's workload" : "close to a weekly starter's workload"}.
    He then scored <strong>${Math.abs(p.fpoe).toFixed(0)}</strong> points ${p.fpoe < 0 ? 'fewer' : 'more'} than that role was
    worth across the season, which is what both prices above are reading. The job and the production
    say different things.
  </p>
  <svg viewBox="0 0 ${W} ${H}" role="img"
       aria-label="Weekly expected fantasy points for ${p.name} across the 2025 season, rising after a mid-season trade.">
    ${/* The axis names itself, on the graphic. A decoder line 400px away in the masthead
          is a key the reader has to carry back — which is exactly what confused David. */''}
    <text x="0" y="20" font-size="13" font-family="var(--dg-font-sans)"
      fill="var(--dg-text-muted)">PPR points — the same scoring as your lineup. Not what he scored: what his targets and carries were worth.</text>

    ${/* The y-axis names itself beside its own numbers, exactly as "week" sits under the
          x-axis numbers. Without this the reader finds three bare integers and no unit —
          David, 2026-08-07: "nothing on the left axis". */''}
    <text transform="rotate(-90 22 ${MT + ih/2})" x="22" y="${MT + ih/2}" text-anchor="middle"
      font-size="13" font-family="var(--dg-font-sans)" fill="var(--dg-text)">fantasy points per game</text>

    ${ticks.map(t => `<line x1="${ML}" x2="${ML+iw}" y1="${Y(t)}" y2="${Y(t)}"
        stroke="var(--dg-border)" stroke-width="1"/>
      <text x="${ML-10}" y="${Y(t)+5}" text-anchor="end" font-size="13"
        font-family="var(--dg-font-mono)" fill="var(--dg-text-muted)">${t}</text>`).join('')}

    ${[...Array(18)].map((_,i) => `<text x="${X(i+1)}" y="${MT+ih+21}" text-anchor="middle" font-size="13"
        font-family="var(--dg-font-mono)" fill="var(--dg-text-muted)">${i+1}</text>`).join('')}
    <text x="${ML+iw/2}" y="${H-3}" text-anchor="middle" font-size="13"
      font-family="var(--dg-font-mono)" fill="var(--dg-text-muted)">week</text>

    ${/* Reference labelled at the left, where the eye already is reading the axis —
          and seated ABOVE its own line so nothing is drawn through the words. */''}
    <line x1="${ML}" x2="${ML+iw}" y1="${Y(cut)}" y2="${Y(cut)}"
      stroke="var(--tape-soft)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="${ML+5}" y="${Y(cut)-7}" font-size="13" font-family="var(--dg-font-sans)"
      fill="var(--dg-text-muted)">${fmt1(cut)} — a weekly ${p.pos} starter's role. ${anchor.name} ran at exactly this in 2025.</text>

    ${/* One worked example, on the graphic, at the peak the eye already goes to. A definition
          tells you what the unit is; the arithmetic shows you. David, 2026-08-07: "what are the
          numbers? targets?" */''}
    ${(() => {
      const pk = p.weeks.reduce((a,b) => b.role > a.role ? b : a);
      return `<line x1="${X(pk.w)}" x2="${X(pk.w)+22}" y1="${Y(pk.role)-7}" y2="${Y(pk.role)-26}"
                stroke="var(--dg-border-strong)" stroke-width="1"/>
              <text x="${X(pk.w)+26}" y="${Y(pk.role)-22}" font-size="13"
                font-family="var(--dg-font-sans)" fill="var(--dg-text)">
                week ${pk.w}: ${pk.tgt} targets, ${pk.air} air yards</text>
              <text x="${X(pk.w)+26}" y="${Y(pk.role)-4}" font-size="13"
                font-family="var(--dg-font-sans)" fill="var(--dg-text-muted)">
                that opportunity was worth ${fmt1(pk.role)} points</text>`;
    })()}

    ${gapMid !== null ? `
      <line x1="${gapMid}" x2="${gapMid}" y1="${MT-6}" y2="${MT+ih}"
        stroke="var(--dg-border-strong)" stroke-width="1"/>
      <text x="${gapMid-8}" y="${MT-12}" text-anchor="end" font-size="13"
        font-family="var(--dg-font-sans)" fill="var(--dg-text-muted)">${oldTeam}</text>
      <text x="${gapMid+8}" y="${MT-12}" font-size="13"
        font-family="var(--dg-font-sans)" fill="var(--dg-text)">traded to ${p.team}, week ${firstNew.w}</text>` : ''}

    ${segs.map(s => `<path d="${path(s)}" fill="none" stroke="var(--tape)" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round" class="draw"
        style="--len:${(s.length*90)|0}"/>`).join('')}
    ${p.weeks.map(g => `<circle cx="${X(g.w)}" cy="${Y(g.role)}" r="4" fill="var(--dg-bg)"
        stroke="var(--tape)" stroke-width="2" pointer-events="none"/>`).join('')}
    ${/* Hit targets are separate from the marks: 26px wide, meeting WCAG 2.2 SC 2.5.8,
          without inflating the dot the eye reads. Week spacing here is ~46px, so they do not overlap. */''}
    ${p.weeks.map(g => `<rect x="${X(g.w)-13}" y="${MT}" width="26" height="${ih}" fill="transparent"
        tabindex="0" role="img"
        aria-label="week ${g.w}, ${g.team}: ${ingredients(g)}, an opportunity worth ${fmt1(g.role)} points. He scored ${fmt1(g.prod)}."
        data-tip="wk ${g.w} · ${g.team} · ${ingredients(g)} → worth ${fmt1(g.role)} · scored ${fmt1(g.prod)}"/>`).join('')}
  </svg>`;
}
$('#hero').innerHTML = heroFigure(hero);

/* ── small multiples ──────────────────────────────────────────────────── */
$('#gridTitle').textContent = `Every back, receiver and tight end you own who played in 2025`;
$('#gridNote').innerHTML = `${withTape.length} with enough of a season to read a trajectory, ordered by how much ` +
  `the role changed, then ${shortSeason.length} who played less.<br>Every line is on the same axis as the chart above ` +
  `— 0 to ${Y_MAX} expected points a game, weeks 1 to 18. The dashed rule is that position's weekly-starter role ` +
  `(WR ${fmt1(CUT.WR)}, RB ${fmt1(CUT.RB)}, TE ${fmt1(CUT.TE)}).`;

function spark(p){
  const W = 216, H = 40, PAD = 2;
  const X = w => PAD + (w - WK_MIN) / (WK_MAX - WK_MIN) * (W - PAD*2);
  const Y = v => H - PAD - (Math.min(v, Y_MAX) / Y_MAX) * (H - PAD*2);
  const segs = []; let cur = [];
  for (let w = WK_MIN; w <= WK_MAX; w++){
    const g = p.weeks.find(x => x.w === w);
    if (g) cur.push(g); else { if (cur.length) segs.push(cur); cur = []; }
  }
  if (cur.length) segs.push(cur);
  const path = s => s.map((g,i) => `${i?'L':'M'}${X(g.w).toFixed(1)},${Y(g.role).toFixed(1)}`).join('');
  const cut = CUT[p.pos];
  const label = p.roleChange !== undefined
    ? `${p.name}: weekly role across 2025, from ${fmt1(p.roleFirst)} to ${fmt1(p.roleLast6)} points a game.`
    : `${p.name}: weekly role across the ${p.weeks.length} games he played in 2025.`;
  // No per-week dots here. At 40px tall they sit ~5px apart and read as noise;
  // the breaks in the line already carry which weeks are missing.
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${label}">
    <line x1="${PAD}" x2="${W-PAD}" y1="${Y(cut)}" y2="${Y(cut)}" stroke="var(--tape-soft)"
      stroke-width="1" stroke-dasharray="2 5" stroke-opacity=".7"/>
    ${segs.map(s => `<path d="${path(s)}" fill="none" stroke="var(--tape)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
    ${segs.map(s => s.length === 1
      ? `<circle cx="${X(s[0].w)}" cy="${Y(s[0].role)}" r="1.8" fill="var(--tape)"/>` : '').join('')}
  </svg>`;
}

const cells = p => `
    <td class="num"><span class="mval">${p.mktValue != null ? p.mktValue.toLocaleString() : '—'}</span></td>
    <td class="num"><span class="dvs">${p.dvs != null ? p.dvs.toFixed(0) : '—'}</span></td>`;

const fullRow = p => {
  const hi = p.roleChangePctile >= 0.95, lo = p.roleChangePctile <= 0.10;
  return `<tr class="${hi ? 'flag' : ''}${lo ? ' flag-down' : ''}">
    <td><div class="pname">${p.name}</div><div class="pmeta">${p.pos} · ${p.age} · yr ${p.exp} · ${p.team}</div></td>
    <td class="spark">${spark(p)}</td>
    <td><span class="rolechg">${fmt1(p.roleFirst)}<span class="arrow">→</span><span class="to">${fmt1(p.roleLast6)}</span></span></td>
    <td class="num"><span class="rolechg">${p.roleChange > 0 ? '+' : ''}${fmt1(p.roleChange)}</span></td>
    <td class="num"><span class="pct ${hi ? 'hi' : ''}${lo ? 'lo' : ''}">${ord(Math.round(p.roleChangePctile*100))}</span></td>
    ${cells(p)}</tr>`;
};

// Played, but not enough of it. These are NOT "no tape" — the line is real and is drawn;
// what is missing is the trajectory, because a first-half/last-six split needs a season.
const partialRow = p => `<tr class="partial">
    <td><div class="pname">${p.name}</div><div class="pmeta">${p.pos} · ${p.age} · yr ${p.exp} · ${p.team}</div></td>
    <td class="spark">${spark(p)}</td>
    <td colspan="3" class="why">${p.weeks.length} games — too little of the season to split</td>
    ${cells(p)}</tr>`;

const band = (label, n) =>
  `<tr class="band"><td colspan="7"><span>${label}</span><span class="n">${n} player${n===1?'':'s'}</span></td></tr>`;

$('#tbl tbody').innerHTML =
  withTape.map(fullRow).join('') +
  (shortSeason.length
    ? band('Played fewer than ' + MIN_G + ' games — the line is real, the trajectory is not', shortSeason.length)
      + shortSeason.map(partialRow).join('')
    : '');

/* ── absence, named ───────────────────────────────────────────────────── */
$('#absent').innerHTML = `
  <h3>Did not play in 2025 — ${noTape.length} players</h3>
  <p>Not zeros, and not sorted to the bottom of the list as though they had been measured and found
     wanting. There is no season on the record, so this surface says nothing about them.</p>
  <ul>${noTape.map(p => `<li>${p.name} <span>${p.pos} · ${p.exp === 0 ? 'entered the league in 2026' : 'no games played'}</span></li>`).join('')}</ul>`;

/* ── the refusal, stated ──────────────────────────────────────────────── */
const qbPlayed = qbs.filter(p => p.weeks.length > 0)
                    .sort((a,b) => (b.mktValue || 0) - (a.mktValue || 0));
const qbWorst = qbs.filter(p => p.roleChange !== undefined)
                   .sort((a,b) => a.roleChange - b.roleChange)[0];
const last = n => n.split(' ').slice(-1)[0];

$('#refusal').innerHTML =
  `<b>Not drawn, on purpose — your ${qbs.length} quarterbacks.</b> Quarterback roles sit on a scale of their ` +
  `own (the median QB role is worth ${fmt1(META.medianRole.QB)} points a game against a receiver's ` +
  `${fmt1(META.medianRole.WR)}), so putting them on the axis above would compress everything else. And in ` +
  `that room there is no disagreement to show: ordered by market value they are ` +
  `${qbPlayed.map(p => last(p.name)).join(', ')} — which is also the order of their 2025 roles. ` +
  `<b>One thing that hides, so it goes here:</b> ${qbWorst.name}'s role fell from ` +
  `${fmt1(qbWorst.roleFirst)} to ${fmt1(qbWorst.roleLast6)} points a game, the steepest collapse of any ` +
  `player in the ${META.populationN}. ` +
  `<b>Also absent from every line above: production.</b> This surface is only about the job a player was ` +
  `given. What he did with it is a different question and it is not answered here.`;

$('#prov').textContent =
  `role + production: nflverse ff_opportunity, 2025 regular season, PPR · market: FantasyCalc ${META.marketCapture} · ` +
  `model: DVS ${META.modelCapture} · roster snapshot ${META.snapshot.slice(0,10)} · ` +
  `starter cut = ${META.starterCutRanks.WR}th WR / ${META.starterCutRanks.RB}th RB / ${META.starterCutRanks.TE}th TE by expected pts/game, min 6 games · ` +
  `regenerate: python3 proposals/017-the-job/build.py`;

/* ── hover layer ──────────────────────────────────────────────────────── */
const tip = $('#tip');
function show(e){
  const t = e.target.closest('[data-tip]'); if (!t) return;
  tip.textContent = t.dataset.tip;
  const r = t.getBoundingClientRect();
  tip.style.opacity = 1;
  const w = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(8, r.left + r.width/2 - w/2), innerWidth - w - 8) + 'px';
  tip.style.top  = (r.top - tip.offsetHeight - 8) + 'px';
}
function hide(){ tip.style.opacity = 0; }
document.addEventListener('pointerover', show);
document.addEventListener('pointerout', hide);
document.addEventListener('focusin', show);
document.addEventListener('focusout', hide);

} catch (e) { fail(e); }
</script>
</body>
</html>
