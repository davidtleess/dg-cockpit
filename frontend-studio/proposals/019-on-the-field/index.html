<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your roster on the field — Dynasty Genius / Studio 019</title>
<style>
  :root{
    --bg:oklch(0.16 0.01 250); --surface:oklch(0.20 0.012 250); --raised:oklch(0.24 0.014 250);
    --border:oklch(0.32 0.012 250); --border-strong:oklch(0.48 0.014 250);
    --text:oklch(0.94 0.005 250); --muted:oklch(0.70 0.008 250); --faint:oklch(0.54 0.010 250);
    --model:oklch(0.72 0.11 255); --market:oklch(0.76 0.13 75);
    /* Layer 2 — IDENTITY: position. Measured deutan ΔE 8.4, normal 15.8; always co-labelled
       with the two-letter position, which is what makes the tritan band legal. */
    --qb:oklch(0.60 0.15 300); --rb:oklch(0.64 0.15 130);
    --wr:oklch(0.52 0.15 5);   --te:oklch(0.58 0.13 200);
    /* Layer 0 — the ground: a tinted neutral ramp carrying depth, never meaning. */
    --g1:oklch(0.17 0.012 258); --g2:oklch(0.21 0.014 258); --g3:oklch(0.245 0.015 258);
    --display:"Archivo","Archivo Narrow",system-ui,sans-serif;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sm:13px; --base:15px; --lg:18px; --xl:24px;
    --r:6px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--g1);color:var(--text);font-family:var(--sans);
       font-size:var(--base);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 20px 72px}
  .kicker{font-family:var(--mono);font-size:var(--sm);letter-spacing:.09em;text-transform:uppercase;
          color:var(--muted);margin:0 0 12px}
  h1{font-family:var(--display);font-size:var(--xl);font-weight:650;letter-spacing:-.015em;
     margin:0 0 8px;max-width:32ch;line-height:1.2}
  .lede{color:var(--muted);font-size:var(--sm);max-width:78ch;margin:0 0 4px}
  .lede b{color:var(--text);font-weight:600}

  .hero{background:var(--g2);border:1px solid var(--border);border-radius:var(--r);
        padding:18px 20px 12px;margin:16px 0 8px}
  .hero h2{margin:0 0 2px}
  .hero .sub{color:var(--muted);font-size:var(--sm);margin:0 0 10px;max-width:92ch}
  .hero .plot{position:relative;overflow-x:auto}
  /* Never let a responsive viewBox shrink type below the floor: at a narrow width the panel
     scrolls sideways instead of becoming unreadable. */
  .hero .plot svg{min-width:1000px}   /* == the viewBox width, so scale never drops below 1 */
  .hero svg{display:block;width:100%;height:auto;overflow:visible}
  .hero svg:focus-visible{outline:2px solid var(--text);outline-offset:3px}
  /* Every mark can name itself. 157 anonymous dots broke the rule that a mark standing for a
     real entity must be able to say which one — hover, tap, or arrow-key through them. */
  .tip{position:absolute;pointer-events:none;z-index:5;background:var(--g1);
       border:1px solid var(--border-strong);border-radius:var(--r);padding:8px 11px;
       font-size:13px;line-height:1.45;white-space:nowrap;transform:translate(-50%,-100%);
       box-shadow:0 6px 18px rgba(0,0,0,.5);opacity:0;transition:opacity .09s}
  .tip.on{opacity:1}
  .tip .nm{font-family:var(--display);font-weight:650;font-size:15px}
  .tip .ow{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tip .st{font-family:var(--mono);font-size:13px;margin-top:3px}
  @media (prefers-reduced-motion:reduce){.tip{transition:none}}
  .hint{font-family:var(--mono);font-size:12px;color:var(--faint);margin:6px 0 0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;
          color:var(--muted);margin-top:6px}
  .legend b{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:600}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  h2{font-family:var(--display);font-size:var(--lg);font-weight:650;margin:0}
  .grp{margin:26px 0 0}
  .grp-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
            border-bottom:1px solid var(--border-strong);padding-bottom:6px;margin-bottom:10px}
  .grp-head .n{font-family:var(--mono);font-size:var(--sm);color:var(--muted)}
  .posbadge{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;
            color:#fff;background:var(--phue);border-radius:4px;padding:3px 8px;
            text-shadow:0 1px 2px rgba(0,0,0,.4)}

  /* One card per player. SIZE is carried by the headshot and scales CONTINUOUSLY with snap
     share, so nothing is made prominent by the copy happening to find a phrase for it — a
     roster of part-timers renders as a page of small faces, which is the honest picture. */
  .p{display:flex;gap:14px;align-items:flex-start;background:var(--g2);
     border:1px solid var(--border);border-left:4px solid var(--team,var(--border-strong));
     border-radius:var(--r);padding:12px 14px;margin:0 0 8px}
  .p .face{flex:none;border-radius:var(--r);object-fit:cover;object-position:top center;
           background:var(--raised)}
  .p .body{flex:1;min-width:0}
  .p .nm{font-family:var(--display);font-size:var(--lg);font-weight:650;letter-spacing:-.01em;
         line-height:1.15}
  .p .meta{font-family:var(--mono);font-size:13px;color:var(--faint);margin-top:2px}
  /* THE READ is the product. It gets body size and full contrast; the metrics behind it
     are the evidence and sit quieter underneath. */
  .p .read{font-size:var(--base);margin:7px 0 0;max-width:74ch}
  .p .read b{font-weight:650}
  .p .ev{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:7px;
         font-family:var(--mono);font-size:13px;color:var(--muted)}
  .p .ev span b{color:var(--text);font-weight:600}
  .p .lanes{flex:none;text-align:right;font-family:var(--mono);font-size:13px;color:var(--faint);
            min-width:92px}
  /* neutral: position carries hue on this surface, so the lanes must not compete */
  .p .lanes .mk,.p .lanes .md{color:var(--muted)}
  @media (max-width:720px){.p{flex-wrap:wrap}.p .lanes{text-align:left;min-width:0}}

  .absent{margin-top:26px;background:var(--surface);border:1px solid var(--border);
          border-radius:var(--r);padding:14px 16px}
  .absent h3{font-family:var(--display);font-size:var(--base);margin:0 0 4px}
  .absent p{margin:0 0 10px;color:var(--muted);font-size:var(--sm);max-width:84ch}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:7px;border:1px dashed var(--border-strong);
        border-radius:999px;padding:3px 12px 3px 3px;font-size:var(--sm);color:var(--muted)}
  .chip img{width:26px;height:26px;border-radius:999px;object-fit:cover;object-position:top center;
            filter:grayscale(1) opacity(.6);background:var(--raised)}
  .chip b{color:var(--text);font-weight:600}
  .fallback{display:grid;place-items:center;flex:none;color:#fff;font-family:var(--display);
            font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}

  /* ── the expansion. Inline, in the row, pushing what follows down — David's standing
     preference since 2026-07-15 (a tray "is still a space eater"; a sidebar becomes the
     only focal point). It overlays nothing and closes back into the flow. ── */
  .p{flex-wrap:wrap}
  .toggle{margin-left:auto;align-self:flex-start;background:none;border:1px solid var(--border);
          color:var(--muted);border-radius:999px;font-family:var(--mono);font-size:12px;
          padding:4px 12px;cursor:pointer;min-height:28px}
  .toggle:hover{border-color:var(--border-strong);color:var(--text)}
  .toggle:focus-visible{outline:2px solid var(--model);outline-offset:2px}
    .exp{flex-basis:100%;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
       background:var(--g3);margin-left:-14px;margin-right:-14px;padding:12px 14px 2px;
       border-radius:0 0 var(--r) var(--r)}
  .exp h4{font-family:var(--display);font-size:var(--sm);font-weight:650;margin:0 0 2px;
          letter-spacing:.01em}
  .exp .pop{font-family:var(--mono);font-size:12px;color:var(--faint);margin:0 0 8px}
  .exp .blk{margin:0 0 16px}
  .mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:4px 20px}
  .met{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;
       padding:3px 0;border-bottom:1px solid oklch(0.26 0.012 250)}
  .met .k{font-size:13px;color:var(--muted)}
  .met .v{font-family:var(--mono);font-size:var(--sm);font-weight:600;
          font-variant-numeric:tabular-nums}
  .met .bar{grid-column:1/-1;height:5px;border-radius:3px;background:oklch(0.28 0.012 250);
            overflow:hidden;margin-top:1px}
  .met .bar{position:relative}
  .met .bar i{display:block;height:100%;background:var(--phue,var(--text));border-radius:3px}
  .met .bar u{position:absolute;top:-2px;width:2px;height:9px;background:var(--text);
              opacity:.75;text-decoration:none}
  .met .bar u.med{background:var(--muted);opacity:.9}
  .met.desc .v{color:var(--muted)}
  .scale{margin:6px 0 14px}
  .scale .track{position:relative;height:5px;border-radius:3px;background:oklch(0.28 0.012 250)}
  .scale .track u{position:absolute;top:-2px;width:2px;height:9px;background:var(--text);
                  opacity:.75;text-decoration:none}
  .scale .labs{position:relative;height:16px;font-family:var(--mono);font-size:12px;
               color:var(--muted);margin-top:2px}
  .scale .labs span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .wk figure{margin:0}
  .wk figcaption{font-size:13px;color:var(--muted);margin:0 0 2px}
  .wk svg{display:block;width:100%;height:auto;overflow:visible}
  .prof{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:var(--sm)}
  .prof span{white-space:nowrap}
  .prof b{font-family:var(--mono);font-weight:600}
  .comps{margin-top:6px;font-size:var(--sm);color:var(--muted)}
  .comps b{color:var(--text);font-weight:600}

  footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--border);
         font-family:var(--mono);font-size:13px;color:var(--faint);line-height:1.8;max-width:96ch}
  #fault{display:none;border:2px solid var(--text);border-radius:var(--r);padding:16px;
         margin:16px 0;background:var(--surface)}
  img{max-width:100%}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="fault" role="alert"><b>This page failed to draw — a fault, not an empty result.</b>
    <div id="faultmsg" style="font-family:var(--mono);font-size:13px;margin-top:8px"></div></div>
  <div id="app"></div>
</div>
<script type="module">
const fault=(e)=>{document.getElementById('fault').style.display='block';
  document.getElementById('faultmsg').textContent=String(e&&e.stack||e);console.error(e)};
let META,PLAYERS,NO_TAPE;
let LEAGUE,BACKS,QBS,place;
try{
  ({META,PLAYERS,NO_TAPE,LEAGUE,BACKS,QBS}=await import('./data.js?v='+Date.now()));
  ({place}=await import('./labeler.mjs?v='+Date.now()));
}catch(e){fault(e);throw e}

const TEAM={CHI:'#C83803',NYJ:'#1C8B5B',NE:'#C60C30',LV:'#B4B8BB',JAX:'#22909F',DEN:'#FB4F14',
  TEN:'#4B92DB',CAR:'#0085CA',SEA:'#69BE28',NYG:'#3B62C4',GB:'#FFB612',BAL:'#7B5CD6',LAC:'#0080C6'};
// SVG elements MUST be created in the SVG namespace. This helper was simplified from the
// namespace-aware version and quietly lost that branch, so every <svg>/<line>/<polyline>
// became an HTML element: the weekly charts rendered as the string "0%50%100%161218week".
// The render audit counted `.wk svg` nodes and reported 2 charts, because the nodes existed.
const SVG_TAGS=new Set(['svg','g','line','rect','circle','path','text','tspan','polyline','polygon']);
const $=(t,a={},...k)=>{const e=SVG_TAGS.has(t)
    ? document.createElementNS('http://www.w3.org/2000/svg',t)
    : document.createElement(t);
  for(const[q,v]of Object.entries(a)){if(v==null)continue;q==='html'?e.innerHTML=v:e.setAttribute(q,v)}
  for(const c of k.flat())if(c!=null)e.append(c);return e};
const initials=(n)=>n.split(/\s+/).filter(w=>!/^(jr|sr|ii|iii|iv)\.?$/i.test(w))
  .slice(0,2).map(w=>w[0]).join('');

// Continuous, not banded: 34px at no snaps, 76px at every snap. Encoding role size by area
// avoids asserting a category at a boundary, which is what produced "Jeanty, committee back"
// at 19.9 touches and "Odunze, nothing to say" at a 23.6% target share.
const faceSize=(snap)=>Math.round(34+42*Math.min(Math.max((snap??0)/100,0),1));

const face=(p,px)=>{
  const img=$('img',{class:'face',src:`heads/${p.sleeperId}.jpg`,alt:'',loading:'lazy',
                     width:px,height:px});
  img.style.width=img.style.height=px+'px';
  img.addEventListener('error',()=>{
    const d=$('div',{class:'face fallback'},initials(p.name));
    d.style.width=d.style.height=px+'px';
    d.style.fontSize=Math.max(11,Math.round(px/3.4))+'px';
    d.style.background=TEAM[p.team]||'#5A6472';
    d.style.borderRadius='var(--r)';
    img.replaceWith(d);
  });
  return img;
};

// ── weekly share line. Fixed 0-100% on both charts so two players and two metrics are
// comparable — an auto-scaled sparkline per row was confirmed as a real defect (004 N4).
// Axis named beside its own ticks, not above the plot (2026-08-07, three passes to learn).
function weekLine(rows, key, title){
  const W=460,H=150,L=42,R=10,T=10,B=26;
  const x=(w)=>L+(W-L-R)*((w-1)/17), y=(v)=>T+(H-T-B)*(1-Math.min(Math.max(v,0),100)/100);
  const g=[];
  for(const t of [0,50,100]){
    g.push($('line',{x1:L,x2:W-R,y1:y(t),y2:y(t),stroke:'var(--border)','stroke-width':1}));
    g.push($('text',{x:L-6,y:y(t)+4,'text-anchor':'end',fill:'var(--faint)','font-size':12,
                     'font-family':'var(--mono)'},t+'%'));
  }
  const pts=rows.filter(r=>r[key]!=null);
  // A missed week renders as a BREAK, never as a zero — absence is not inactivity.
  let run=[];
  const flush=()=>{ if(run.length>1) g.push($('polyline',{points:run.map(r=>`${x(r.w)},${y(r[key])}`).join(' '),
      fill:'none',stroke:'var(--text)','stroke-width':2,'stroke-linejoin':'round'}));
    if(run.length===1) g.push($('circle',{cx:x(run[0].w),cy:y(run[0][key]),r:2.5,fill:'var(--text)'}));
    run=[]; };
  let prev=null;
  for(const r of pts){ if(prev!==null && r.w!==prev+1) flush(); run.push(r); prev=r.w; }
  flush();
  for(const r of pts) g.push($('circle',{cx:x(r.w),cy:y(r[key]),r:2.2,fill:'var(--text)'}));
  for(const w of [1,6,12,18]) g.push($('text',{x:x(w),y:H-B+16,'text-anchor':'middle',
    fill:'var(--faint)','font-size':12,'font-family':'var(--mono)'},String(w)));
  g.push($('text',{x:(L+W-R)/2,y:H-2,'text-anchor':'middle',fill:'var(--faint)','font-size':12},'week'));
  return $('figure',{},$('figcaption',{},title),
    $('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':title+' by week'},g));
}

function expansion(p){
  const e=p.expansion||{}; const box=$('div',{class:'exp',hidden:''});
  box.style.setProperty('--phue',POSHUE[p.pos]);
  const m=e.metrics||[];
  if(m.length){
    const b=$('div',{class:'blk'},$('h4',{},'Where the work came from, and what he did with it'),
      $('p',{class:'pop'},'the ticks are what a top-12 number, a top-24 number and this '
        +'league\'s starter cut look like at his position, among '+p.pos+'s with a real 2025 '
        +'season. Hover a tick for the value. Two rows describe how he is used rather than how '
        +'well, so they carry no ranking.'));
    // The scale is labelled ONCE at the top and every bar below uses it — Savant's device,
    // and the reason it is legal under "no key the reader re-applies" is that the rungs sit
    // at fixed RANKS (12 / 24 / the league's starter cut), so they land in the same place on
    // every bar. Verified: with n=118 they fall at 90th / 80th / 69th on all of them.
    const ref=m.find(x=>!x.descriptive && (x.ladder||[]).length);
    if(ref){
      const track=$('div',{class:'track'}), labs=$('div',{class:'labs'});
      for(const r of ref.ladder){
        const pc=Math.round((r.pctile??0)*100);
        const u=$('u',{}); u.style.left=`calc(${pc}% - 1px)`; track.append(u);
        const sp=$('span',{},r.label); sp.style.left=pc+'%'; labs.append(sp);
      }
      b.append($('div',{class:'scale'},track,labs,
        $('p',{class:'pop',style:'margin:14px 0 0'},
          'every bar below carries these same three ticks, at the same three ranks')));
    }
    const grid=$('div',{class:'mets'});
    for(const x of m){
      const pc=Math.round((x.pctile??0)*100);
      const bar=$('span',{class:'bar'});
      if(x.descriptive){
        // no good direction, so no fill and no ladder — only where the league sits, and the
        // number. Ranking "slot rate" would assert that being a slot receiver is worse.
        const med=$('u',{class:'med'});
        med.style.left='50%'; med.title=`league median ${x.median}${x.unit}`;
        bar.append(med);
      }else{
        const i=$('i',{}); i.style.width=pc+'%';
        i.title=`${pc}th percentile of ${x.n}`; bar.append(i);
        for(const r of (x.ladder||[])){
          const u=$('u',{}); u.style.left=`calc(${Math.round((r.pctile??0)*100)}% - 1px)`;
          u.title=`${r.label} — ${r.value}${x.unit}`; bar.append(u);
        }
      }
      grid.append($('div',{class:'met'+(x.descriptive?' desc':'')},
        $('span',{class:'k'},x.label+(x.descriptive?' · how he is used':'')),
        $('span',{class:'v'},`${x.value}${x.unit}`), bar));
    }
    b.append(grid); box.append(b);
  }
  if((e.weekly||[]).length){
    box.append($('div',{class:'blk'},$('h4',{},'Week by week'),
      $('p',{class:'pop'},'both charts on the same 0–100% scale, so weeks and players compare; '
        +'a gap in the line is a week he did not play'),
      $('div',{class:'wk'},weekLine(e.weekly,'snap','Snap share'),
                           weekLine(e.weekly,'tgt','Target share'))));
  }
  const pr=e.profile||{};
  const bits=[];
  if(pr.draftPick) bits.push(['drafted',pr.draftPick]);
  if(pr.breakoutAge) bits.push(['breakout age',pr.breakoutAge]);
  if(pr.collegeDominator) bits.push(['college dominator',pr.collegeDominator+'%']);
  if(pr.speedScore) bits.push(['speed score',pr.speedScore]);
  if(pr.heightIn&&pr.weightLb) bits.push(['size',`${Math.floor(pr.heightIn/12)}'${pr.heightIn%12}" ${pr.weightLb}lb`]);
  if(pr.college) bits.push(['college',pr.college]);
  if(bits.length||((pr.comparables||[]).length)){
    const b=$('div',{class:'blk'},$('h4',{},'Who he is'),
      $('p',{class:'pop'},'the part the season cannot tell you — draft capital, when he broke '
        +'out, and who he profiles like'),
      $('div',{class:'prof'},bits.map(([k,v])=>$('span',{},k+' ',$('b',{},String(v))))));
    if((pr.comparables||[]).length)
      b.append($('p',{class:'comps'},'profiles like ',
        ...pr.comparables.map((c,i)=>[i?', ':'',$('b',{},c)]).flat()));
    box.append(b);
  }
  if(!box.children.length) box.append($('p',{class:'pop'},'No expansion data on file for him.'));
  return box;
}

const POSHUE={QB:'var(--qb)',RB:'var(--rb)',WR:'var(--wr)',TE:'var(--te)'};
const surname=(n)=>{const w=n.split(/\s+/).filter(x=>!/^(jr|sr|ii|iii|iv|v)\.?$/i.test(x));
  return w[w.length-1]||n;};

// The roster map. One dominant graphic instead of eighteen equal cards: every pass-catcher
// placed by how big his role was and how much he did with it, so the shape of the room is
// visible before a single word is read. Backs are excluded because yards-per-route is not
// how a back is measured — stated on the figure rather than fudged onto a shared axis.
// Ownership gets LIGHTNESS, never hue — dimension 8 of the colour system, and the answer
// David arrived at independently ("greyed out if not on my team, a different shade if on
// waivers"). Unrostered players are drawn LIGHTER than other teams' players because they
// are the acquirable ones: visual weight follows what he can act on.
const OWN={rostered:'oklch(0.46 0.008 258)', open:'oklch(0.80 0.016 258)'};

function rosterMap(cfg){
  const {rows, xKey, yKey, xLabel, yLabel, xMax, refX, refXLabel, refY, refYLabel,
         yFmt=(v)=>v.toFixed(2), unit='', H:HH=430} = cfg;
  const P=rows.filter(r=>r.ownership==='mine');
  const W=1000,H=HH,L=68,R=24,T=22,B=52;
  const others=rows.filter(r=>r.ownership!=='mine');
  const ys=rows.map(r=>r[yKey]);
  const xmax=xMax;
  const ymin=Math.max(0,Math.floor((Math.min(...ys)-0.15)*10)/10);
  const ymax=Math.ceil((Math.max(...ys)+0.15)*10)/10;
  const x=(v)=>L+(W-L-R)*(v/xmax), y=(v)=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin));
  const g=[];
  // reference lines = the published bars, labelled ON the figure
  g.push($('line',{x1:x(refX),x2:x(refX),y1:T,y2:H-B,stroke:'var(--border-strong)','stroke-width':1,
                   'stroke-dasharray':'3 4'}));
  g.push($('text',{x:x(refX)+6,y:T+13,fill:'var(--muted)','font-size':13},refXLabel));
  g.push($('line',{x1:L,x2:W-R,y1:y(refY),y2:y(refY),stroke:'var(--border-strong)','stroke-width':1,
                   'stroke-dasharray':'3 4'}));
  g.push($('text',{x:L+6,y:y(refY)-7,fill:'var(--muted)','font-size':13},refYLabel));
  for(const t of [0,xmax*0.25,xmax*0.5,xmax*0.75,xmax]){
    g.push($('text',{x:x(t),y:H-B+20,'text-anchor':'middle',fill:'var(--faint)','font-size':13,
                     'font-family':'var(--mono)'},Math.round(t)+unit));
  }
  g.push($('text',{x:(L+W-R)/2,y:H-B+40,'text-anchor':'middle',fill:'var(--muted)','font-size':13},
          xLabel));
  const ticks=[ymin,(ymin+ymax)/2,ymax];
  for(const t of ticks){
    g.push($('text',{x:L-10,y:y(t)+4,'text-anchor':'end',fill:'var(--faint)','font-size':13,
                     'font-family':'var(--mono)'},yFmt(t)));
  }
  g.push($('text',{transform:`translate(20,${(T+H-B)/2}) rotate(-90)`,'text-anchor':'middle',
                   fill:'var(--muted)','font-size':13},yLabel));
  // the league first, so his players sit on top of it
  for(const l of others)
    g.push($('circle',{cx:x(l[xKey]),cy:y(l[yKey]),r:l.ownership==='open'?4.4:3,
                       fill:OWN[l.ownership],opacity:1}));
  // Direct-label the two population states by pointing at a real example of each, with the
  // count — a key the reader re-applies is exactly what principle 2 forbids, and it also
  // states the highlight rule out loud.
  const annos=[];
  // marks + names, de-collided vertically with a leader so a moved label stays attached
  // Measure, then place by simulated annealing (kit/labeler.mjs). The greedy "nudge up until
  // nothing collides" loop this replaces had no cost for distance from the anchor, which is
  // how Dike's name ended up 52px from his own dot and beside somebody else's.
  const placed=P.map(p=>({p,cx:x(p[xKey]),cy:y(p[yKey])}));
  const CH=6.6, LH=15;                     // measured advance width at 13px Archivo/Plex
  const labelText=(p)=>surname(p.name)+' '+p.pos;
  const boxes=placed.map(({p,cx,cy})=>({x:cx+11,y:cy-LH/2,w:labelText(p).length*CH,h:LH}));
  const anchorsAll=[...others.map(o=>({x:x(o[xKey]),y:y(o[yKey]),r:o.ownership==='open'?4.4:3})),
                    ...placed.map(({cx,cy})=>({x:cx,y:cy,r:7}))];
  const myAnchors=placed.map(({cx,cy})=>({x:cx,y:cy,r:7}));
  place(boxes,myAnchors,{width:W,height:H,sweeps:700,seed:20260809,
    obstacles:[{x:L,y:T,w:220,h:22},{x:x(refX),y:T,w:230,h:22},
               {x:L,y:y(refY)-18,w:300,h:18}]});
  for(let i=0;i<placed.length;i++){
    const {p,cx,cy}=placed[i], b2=boxes[i];
    const lx=b2.x, ly=b2.y+LH*0.72;
    const bcx=b2.x+b2.w/2, bcy=b2.y+b2.h/2;
    if(Math.hypot(bcx-cx,bcy-cy)>18)
      g.push($('line',{x1:cx,y1:cy,x2:bcx<cx?b2.x+b2.w:b2.x,y2:bcy,
                       stroke:'var(--border-strong)','stroke-width':1}));
    g.push($('circle',{cx,cy,r:7,fill:POSHUE[p.pos],stroke:'var(--g2)','stroke-width':1.5}));
    g.push($('text',{x:lx,y:ly,fill:'var(--text)','font-size':13,'font-weight':600},labelText(p)));
  }

  const svg=$('svg',{viewBox:`0 0 ${W} ${H}`,role:'img',tabindex:'0',
    'aria-label':`Scatter of ${rows.length} players by ${xLabel} and ${yLabel}. `
      +`Use arrow keys to move between players.`},g);

  // ── the interaction layer ───────────────────────────────────────────────────────────
  // Nearest-point hit testing rather than per-dot handlers: the marks are 3-7px, far under
  // any sane target size, so the whole plot is the target and the closest mark wins.
  const pts=rows.map(d=>({d,px:x(d[xKey]),py:y(d[yKey])}));
  const wrap=$('div',{class:'plot'},svg);
  const tip=$('div',{class:'tip',role:'status','aria-live':'polite'});
  wrap.append(tip);
  const halo=$('circle',{r:11,fill:'none',stroke:'var(--text)','stroke-width':2,opacity:'0'});
  g.push(halo); svg.append(halo);
  const OWNWORD={mine:'yours',rostered:'on another roster',open:'nobody owns him'};
  let idx=-1;
  const show=(i)=>{
    idx=i; const {d,px,py}=pts[i];
    const r=svg.getBoundingClientRect(), k=r.width/W;
    halo.setAttribute('cx',px); halo.setAttribute('cy',py); halo.setAttribute('opacity','0.9');
    tip.textContent='';
    tip.append($('div',{class:'nm'},`${d.name} · ${d.pos}`),
      $('div',{class:'ow'},OWNWORD[d.ownership]+(d.owner?` — ${d.owner}`:'')),
      $('div',{class:'st'},`${yFmt(d[yKey])} ${yLabel} · ${Math.round(d[xKey])}${unit} ${xLabel}`),
      d.thin?$('div',{class:'ow'},'thin sample — the rate has not settled'):null);
    tip.style.left=(px*k)+'px'; tip.style.top=(py*k-14)+'px';
    tip.classList.add('on');
  };
  const hide=()=>{tip.classList.remove('on'); halo.setAttribute('opacity','0'); idx=-1;};
  svg.addEventListener('pointermove',(ev)=>{
    const r=svg.getBoundingClientRect(), k=r.width/W;
    const mx=(ev.clientX-r.left)/k, my=(ev.clientY-r.top)/k;
    let best=-1,bd=1e9;
    for(let i=0;i<pts.length;i++){const dx=pts[i].px-mx,dy=pts[i].py-my,d2=dx*dx+dy*dy;
      if(d2<bd){bd=d2;best=i;}}
    if(best>=0 && bd<=26*26) show(best); else hide();
  });
  svg.addEventListener('pointerleave',hide);
  svg.addEventListener('blur',hide);
  const order=pts.map((p,i)=>i).sort((a,b)=>pts[a].px-pts[b].px);
  svg.addEventListener('keydown',(ev)=>{
    const k=ev.key;
    if(k!=='ArrowRight'&&k!=='ArrowLeft'&&k!=='Home'&&k!=='End'&&k!=='Escape') return;
    ev.preventDefault();
    if(k==='Escape') return hide();
    const cur=order.indexOf(idx);
    let n = k==='Home'?0 : k==='End'?order.length-1
          : cur<0 ? 0 : Math.min(order.length-1,Math.max(0,cur+(k==='ArrowRight'?1:-1)));
    show(order[n]);
  });
  return wrap;
}
