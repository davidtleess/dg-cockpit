<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>021 · The trade ledger — Studio prototype</title>
<style>
  /* Product tokens (dark theme, as shipped) — deliberately the product's language */
  :root {
    --bg: oklch(0.16 0.01 250);
    --surface: oklch(0.2 0.012 250);
    --raised: oklch(0.24 0.014 250);
    --border: oklch(0.32 0.012 250);
    --border-strong: oklch(0.48 0.014 250);
    --ink: oklch(0.92 0.005 250);
    --ink-muted: oklch(0.68 0.008 250);
    --model: oklch(0.72 0.11 255);
    --market: oklch(0.76 0.13 75);
    --qb: oklch(0.60 0.15 300);
    --rb: oklch(0.64 0.15 130);
    --wr: oklch(0.52 0.15 5);
    --te: oklch(0.58 0.13 200);
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --t-sm: 13px; --t-base: 15px; --t-lg: 18px;
    --sans: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 var(--t-base)/1.45 var(--sans);
    padding: 32px 20px 64px;
  }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* masthead */
  .eyebrow { font-size: var(--t-sm); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
  h1 { font-size: var(--t-lg); font-weight: 700; letter-spacing: 0.01em; margin: var(--s1) 0 var(--s2); }
  .mast-facts { font-size: var(--t-sm); color: var(--ink-muted); max-width: 62ch; }
  .mast-facts b { color: var(--ink); font-weight: 600; }
  .accrual {
    margin-top: var(--s3); padding: var(--s3) var(--s4);
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    font-size: var(--t-sm); color: var(--ink-muted); max-width: 72ch;
  }
  .accrual b { color: var(--ink); font-weight: 600; }

  /* filter chips */
  .chips { display: flex; gap: var(--s2); margin: var(--s4) 0 var(--s2); }
  .chip {
    font: 500 var(--t-sm)/1 var(--sans); color: var(--ink-muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--border-strong); background: var(--raised); }
  .chip:focus-visible { outline: 2px solid var(--model); outline-offset: 2px; }

  /* season divider */
  .season { display: flex; align-items: center; gap: var(--s3); margin: 28px 0 var(--s3); }
  .season span { font-size: var(--t-sm); font-weight: 600; letter-spacing: 0.06em; color: var(--ink-muted); }
  .season::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* trade card */
  .trade {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: var(--s4); margin-bottom: var(--s3);
  }
  .trade-head { display: flex; align-items: baseline; gap: var(--s2); margin-bottom: var(--s3); }
  .trade-date { font-size: var(--t-base); font-weight: 600; }
  .yours {
    font-size: var(--t-sm); color: var(--ink-muted);
    border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px;
  }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
  @media (max-width: 640px) { .sides { grid-template-columns: 1fr; } }
  .side-name { font-size: var(--t-sm); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: var(--s2); }

  /* asset line */
  .asset { display: flex; gap: var(--s2); padding: var(--s2) 0; border-top: 1px solid var(--border); }
  .asset:first-of-type { border-top: 0; }
  .face, .pickchip { width: 28px; height: 28px; border-radius: 999px; flex: none; margin-top: 2px; background: var(--raised); object-fit: cover; }
  .pickchip {
    border-radius: 4px; display: grid; place-items: center;
    font: 600 var(--t-sm)/1 var(--mono); color: var(--ink-muted); border: 1px solid var(--border);
  }
  .a-main { flex: 1; min-width: 0; }
  .a-name { font-size: var(--t-base); font-weight: 600; }
  .a-name .then { color: var(--ink-muted); font-weight: 400; }
  .a-name .arrow { color: var(--ink-muted); font-weight: 400; padding: 0 2px; }
  .pos { font: 600 var(--t-sm)/1 var(--sans); border-radius: 3px; padding: 1px 4px; margin-left: 4px; color: var(--bg); }
  .pos-QB { background: var(--qb); } .pos-RB { background: var(--rb); }
  .pos-WR { background: var(--wr); } .pos-TE { background: var(--te); }
  .pos-other { background: var(--border-strong); }
  .a-meta { font-size: var(--t-sm); color: var(--ink-muted); }
  .a-meta .dvs { color: var(--model); font-weight: 500; }
  .a-val { text-align: right; flex: none; }
  .a-val .v { font: 500 var(--t-base)/1.3 var(--mono); }
  .a-val .r { font-size: var(--t-sm); color: var(--ink-muted); }
  .a-val .none { font-size: var(--t-sm); color: var(--ink-muted); }

  /* haul bars — one shared scale across the whole page */
  .hauls { margin-top: var(--s3); border-top: 1px solid var(--border); padding-top: var(--s3); }
  .haul { display: grid; grid-template-columns: 110px 1fr 72px; align-items: center; gap: var(--s2); padding: 3px 0; }
  .haul .who { font-size: var(--t-sm); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .haul .track { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
  .haul .fill { height: 100%; border-radius: 4px; background: var(--market); min-width: 2px; }
  .haul .tot { font: 500 var(--t-sm)/1 var(--mono); text-align: right; }
  .haul-label { font-size: var(--t-sm); color: var(--ink-muted); margin-bottom: var(--s1); }
  .unpriced-note { font-size: var(--t-sm); color: var(--ink-muted); margin-top: var(--s1); }

  /* startup swap — deliberately outside the bar system */
  .swap-note { font-size: var(--t-base); color: var(--ink); max-width: 68ch; }
  .swap-why { font-size: var(--t-sm); color: var(--ink-muted); margin-top: var(--s2); max-width: 68ch; }
  .expand {
    margin-top: var(--s3); font: 500 var(--t-sm)/1 var(--sans);
    background: var(--raised); color: var(--ink); border: 1px solid var(--border);
    border-radius: 4px; padding: 7px 12px; cursor: pointer;
  }
  .expand:focus-visible { outline: 2px solid var(--model); outline-offset: 2px; }
  .swap-detail { margin-top: var(--s3); }
  .swap-detail .sides { border-top: 1px solid var(--border); padding-top: var(--s3); }

  /* footer */
  .method { margin-top: 40px; border-top: 1px solid var(--border); padding-top: var(--s4); font-size: var(--t-sm); color: var(--ink-muted); max-width: 76ch; }
  .method h2 { font-size: var(--t-sm); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: var(--s2); }
  .method p { margin-bottom: var(--s2); }
  .method code { font-family: var(--mono); font-size: var(--t-sm); }

  .fault {
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px;
    padding: var(--s4); font-size: var(--t-base); color: var(--ink);
  }
  @media (prefers-reduced-motion: no-preference) {
    .trade { transition: border-color 120ms ease; }
    .trade:hover { border-color: var(--border-strong); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Dynasty Genius · Studio prototype 021</div>
    <h1>The trade ledger</h1>
    <p class="mast-facts" id="mastFacts">Loading…</p>
    <p class="accrual" id="accrual"></p>
    <div class="chips" role="group" aria-label="Filter trades">
      <button class="chip" id="chipAll" aria-pressed="true">All trades</button>
      <button class="chip" id="chipMine" aria-pressed="false">Your trades</button>
    </div>
  </header>
  <main id="ledger"><p class="fault" hidden></p></main>
  <footer class="method" id="method"></footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  const $ = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  };
  const fmt = (n) => n == null ? "—" : n.toLocaleString("en-US");
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const prettyDate = (iso) => {
    const [y, m, d] = iso.split("-").map(Number);
    return `${MONTHS[m - 1]} ${d}, ${y}`;
  };
  const ORD = { 1: "1st", 2: "2nd", 3: "3rd" };
  const roundName = (r) => ORD[r] || `R${r}`;
  const pickInRound = (pickNo, round) => pickNo - (round - 1) * 12;

  function assetRow(a, davidSide) {
    const row = $("div", "asset");

    // identity
    if (a.kind === "pick_future") {
      const chip = $("div", "pickchip", `'${String(a.pick.season).slice(2)}`);
      row.appendChild(chip);
    } else {
      const sid = a.kind === "player" ? a.sleeper_id : a.became.sleeper_id;
      const img = $("img", "face");
      img.alt = "";
      img.loading = "lazy";
      img.src = `https://sleepercdn.com/content/nfl/players/thumb/${sid}.jpg`;
      img.onerror = () => { img.replaceWith($("div", "pickchip", "·")); };
      row.appendChild(img);
    }

    const main = $("div", "a-main");
    const name = $("div", "a-name");
    const meta = $("div", "a-meta");

    if (a.kind === "player") {
      name.append(a.name, posBadge(a.position));
      meta.append(metaText(a, davidSide));
    } else if (a.kind === "pick_resolved") {
      const p = a.pick;
      const startup = p.rounds_in_draft > 3;
      const label = startup
        ? `${p.season} startup ${p.round}.${String(pickInRound(p.pick_no, p.round)).padStart(2, "0")}`
        : `${p.season} ${p.round}.${String(pickInRound(p.pick_no, p.round)).padStart(2, "0")}`;
      const then = $("span", "then", label);
      const arrow = $("span", "arrow", " → ");
      name.append(then, arrow, a.became.name, posBadge(a.became.position));
      meta.append(metaText(a, davidSide));
    } else {
      name.append(`${a.pick.season} ${roundName(a.pick.round)}`, $("span", "then", `  (orig ${a.pick.origin})`));
      meta.append("not yet drafted · priced at the round average");
    }

    main.append(name, meta);
    row.appendChild(main);

    const val = $("div", "a-val");
    if (a.now && a.now.value != null) {
      val.appendChild($("div", "v", fmt(a.now.value)));
      if (a.now.position_rank != null && (a.kind === "player" || a.kind === "pick_resolved")) {
        const pos = a.kind === "player" ? a.position : a.became.position;
        val.appendChild($("div", "r", `${pos}${a.now.position_rank}`));
      }
    } else {
      val.appendChild($("div", "none", "unpriced"));
    }
    row.appendChild(val);
    return row;
  }

  function posBadge(pos) {
    const known = ["QB", "RB", "WR", "TE"].includes(pos);
    return $("span", `pos ${known ? "pos-" + pos : "pos-other"}`, pos || "?");
  }

  function metaText(a, davidSide) {
    const bits = [];
    if (a.model) bits.push({ cls: "dvs", text: `DVS ${a.model.dvs}` });
    if (a.kind === "player" && a.fate) {
      if (a.fate.status === "cut") bits.push({ text: `cut ${prettyDate(a.fate.date)}` });
      else if (a.fate.status === "flipped") bits.push({ text: `flipped ${prettyDate(a.fate.date)}` });
      else bits.push({ text: davidSide ? "still yours" : "still rostered" });
    }
    if (a.loc) {
      if (a.loc.where === "free_agent") bits.push({ text: "now a free agent" });
      else if (a.kind === "pick_resolved" || (a.fate && a.fate.status !== "held"))
        bits.push({ text: `now with ${a.loc.manager}` });
      // held players: "still yours / still rostered" already names the holder
    } else if (a.kind === "pick_resolved") {
      bits.push({ text: "never moved since draft" });
    }
    const frag = document.createDocumentFragment();
    bits.forEach((b, i) => {
      if (i) frag.append(" · ");
      frag.append(b.cls ? $("span", b.cls, b.text) : b.text);
    });
    return frag;
  }

  function sideCol(side, isDavid) {
    const col = $("div");
    col.appendChild($("div", "side-name", `${side.manager} got`));
    side.assets.forEach((a) => col.appendChild(assetRow(a, isDavid)));
    return col;
  }

  function tradeCard(t, scaleMax) {
    const card = $("article", "trade");
    const head = $("div", "trade-head");
    head.appendChild($("span", "trade-date", prettyDate(t.date)));
    if (t.involves_david) head.appendChild($("span", "yours", "yours"));
    card.appendChild(head);

    const sides = [...t.sides].sort((a, b) =>
      (b.roster_id === DATA.meta.david_roster) - (a.roster_id === DATA.meta.david_roster));

    if (t.startup_swap) {
      const [s1, s2] = sides;
      card.appendChild($("p", "swap-note",
        `Startup slot swap — ${s1.manager} and ${s2.manager} traded their entire 2023 startup draft positions, all 18 rounds each way (${t.n_assets} picks).`));
      card.appendChild($("p", "swap-why",
        "This row sits outside the haul bars on purpose: pricing two whole startup drafts as trade hauls would be a category error — both sides drafted full rosters from the slots."));
      const btn = $("button", "expand", `Show all ${t.n_assets} picks`);
      btn.setAttribute("aria-expanded", "false");
      const detail = $("div", "swap-detail");
      detail.hidden = true;
      const grid = $("div", "sides");
      sides.forEach((s) => grid.appendChild(sideCol(s, s.roster_id === DATA.meta.david_roster)));
      detail.appendChild(grid);
      btn.addEventListener("click", () => {
        const open = detail.hidden;
        detail.hidden = !open;
        btn.setAttribute("aria-expanded", String(open));
        btn.textContent = open ? "Hide the picks" : `Show all ${t.n_assets} picks`;
      });
      card.append(btn, detail);
      return card;
    }

    const grid = $("div", "sides");
    sides.forEach((s) => grid.appendChild(sideCol(s, s.roster_id === DATA.meta.david_roster)));
    card.appendChild(grid);

    const hauls = $("div", "hauls");
    hauls.appendChild($("div", "haul-label", "hauls at today's values"));
    let unpriced = 0;
    sides.forEach((s) => {
      const h = $("div", "haul");
      h.appendChild($("span", "who", s.manager));
      const track = $("div", "track");
      if (s.market_total != null) {
        const fill = $("div", "fill");
        fill.style.width = `${Math.max(0.4, (s.market_total / scaleMax) * 100)}%`;
        track.appendChild(fill);
      }
      h.appendChild(track);
      h.appendChild($("span", "tot", s.market_total != null ? fmt(s.market_total) : "unpriced"));
      hauls.appendChild(h);
      unpriced += s.unpriced;
    });
    if (unpriced) hauls.appendChild($("div", "unpriced-note",
      `${unpriced} asset${unpriced > 1 ? "s" : ""} in this trade ${unpriced > 1 ? "have" : "has"} no price in today's market universe and sit${unpriced > 1 ? "" : "s"} outside the bars.`));
    card.appendChild(hauls);
    return card;
  }

  function render(mineOnly) {
    const ledger = document.getElementById("ledger");
    ledger.textContent = "";
    const trades = DATA.trades.filter((t) => !mineOnly || t.involves_david);
    const scaleMax = Math.max(...DATA.trades.filter((t) => !t.startup_swap)
      .flatMap((t) => t.sides.map((s) => s.market_total)).filter((v) => v != null));
    let season = null;
    trades.forEach((t) => {
      if (t.season !== season) {
        season = t.season;
        const n = trades.filter((x) => x.season === season).length;
        const div = $("div", "season");
        div.appendChild($("span", null, `${season} · ${n} trade${n > 1 ? "s" : ""}`));
        ledger.appendChild(div);
      }
      ledger.appendChild(tradeCard(t, scaleMax));
    });
  }

  function masthead() {
    const m = DATA.meta;
    const f = document.getElementById("mastFacts");
    f.textContent = "";
    f.append("Every trade this league has made — ", $("b", null, `${m.trades} trades across ${m.seasons.length} seasons`),
      ` — re-read with today's knowledge. Every past pick is resolved to the player it became; every asset is priced at today's market value (${prettyDate(m.priced_on)}).`);
    document.getElementById("accrual").append(
      $("b", null, "What this page cannot show yet: "),
      `what each side was worth on the day of the deal. Daily two-lane pricing began ${prettyDate(m.market_history_start)} and every trade above predates it — so the league's next trade will be the first captured with its at-trade price, and this page starts remembering. It gets better every day it runs.`);
  }

  function methodology() {
    const m = DATA.meta;
    const el = document.getElementById("method");
    el.appendChild($("h2", null, "How to read this, honestly"));
    const points = [
      `A haul total is what that side's assets are worth today, wherever those assets are now — it measures how the deal aged, not how the roster was managed afterward. The fate notes ("cut", "flipped", "now with…") carry the second story.`,
      `Pick → player resolutions come from the league's four completed drafts (2023 startup, 2024–2026 rookie). All ${
        DATA.trades.flatMap((t) => t.sides).flatMap((s) => s.assets).filter((a) => a.kind === "pick_resolved").length
      } past picks resolved; ${m.unresolved_past_picks.length} failures.`,
      `Future picks (2027–2028) are priced at FantasyCalc's round average, because their slot isn't known yet — a mid-round assumption, stated rather than hidden.`,
      `Unpriced players (${m.unpriced_players.join(", ")}) have left today's market universe and are excluded from bars, never counted as zero.`,
      `Blue DVS is our model's 0–100 dynasty value score (capture ${prettyDate(m.model_capture)}); players without a score are in the model-filling work currently in flight and show nothing rather than a guess.`,
      `No verdicts are rendered anywhere on this page. The two bars share one scale; the reader sees the imbalance.`,
    ];
    points.forEach((p) => el.appendChild($("p", null, p)));
    const repro = $("p");
    repro.append("Reproduce every number: ", $("code", null, "python3 tools/trade-retro-build.py"),
      " — reads the ledger, drafts, and both capture stores; deterministic across runs.");
    el.appendChild(repro);
  }

  try {
    if (!window.DATA || !DATA.trades || !DATA.trades.length) throw new Error("data.js missing or empty");
    masthead();
    methodology();
    const chipAll = document.getElementById("chipAll");
    const chipMine = document.getElementById("chipMine");
    chipAll.textContent = `All trades (${DATA.meta.trades})`;
    chipMine.textContent = `Your trades (${DATA.meta.david_trades})`;
    const set = (mine) => {
      chipAll.setAttribute("aria-pressed", String(!mine));
      chipMine.setAttribute("aria-pressed", String(mine));
      render(mine);
    };
    chipAll.addEventListener("click", () => set(false));
    chipMine.addEventListener("click", () => set(true));
    render(false);
  } catch (err) {
    const fault = document.querySelector(".fault");
    fault.hidden = false;
    fault.textContent = `Failed to draw — not an empty result, a fault: ${err.message}`;
  }
})();
</script>
</body>
</html>
