<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>023 — The player card</title>
<link rel="stylesheet" href="/kit/studio-kit.tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--dg-bg); color: var(--dg-text); font: 400 0.9375rem/1.5 var(--dg-font-sans); padding: 2rem 1.5rem 4rem; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1, h2 { font-family: var(--dg-font-display); }
  h1 { font-size: 1.75rem; }                 /* declared display extension: masthead only */
  h2 { font-size: 1.125rem; margin: 2.25rem 0 0.25rem; }
  .sub { color: var(--dg-text-muted); font-size: 0.8125rem; }
  .lede { max-width: 68ch; margin-top: 0.5rem; }

  .retraction { border-left: 2px solid var(--dg-caveat); padding: 0.5rem 0 0.5rem 1rem; margin-top: 1rem; max-width: 74ch; font-size: 0.8125rem; color: var(--dg-text-muted); }
  .retraction b { color: var(--dg-text); font-weight: 600; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
  .card { border: 1px solid var(--dg-border); border-radius: 6px; background: var(--dg-surface); padding: 0.875rem 1rem 1rem; }
  .card > header { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .card .nm { font-family: var(--dg-font-display); font-size: 1.125rem; font-weight: 600; white-space: nowrap; }
  .pos { font-family: var(--dg-font-mono); font-size: 0.8125rem; font-weight: 600; padding: 0 0.3rem; border-radius: 3px; color: var(--dg-bg); }
  .pos.QB { background: var(--dg-pos-qb); } .pos.RB { background: var(--dg-pos-rb); }
  .pos.WR { background: var(--dg-pos-wr); } .pos.TE { background: var(--dg-pos-te); }
  .meta { color: var(--dg-text-muted); font-size: 0.8125rem; }
  .case { margin-left: auto; font-size: 0.8125rem; color: var(--dg-text-muted); font-family: var(--dg-font-mono); }

  .row { margin-top: 0.75rem; }
  .row > .label { font-size: 0.8125rem; color: var(--dg-text-muted); }
  .band svg { display: block; width: 100%; height: 62px; margin-top: 0.125rem; }
  .boards { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.8125rem; margin-top: 0.125rem; }
  .lane-model { color: var(--dg-model); font-weight: 600; }
  .lane-market { color: var(--dg-market); font-weight: 600; }
  .wire { font-size: 0.8125rem; margin-top: 0.125rem; }
  .read { margin-top: 0.75rem; padding-top: 0.625rem; border-top: 1px solid var(--dg-border); font-size: 0.9375rem; }
  .flag { font-size: 0.8125rem; color: var(--dg-caveat); margin-top: 0.375rem; }

  .methodology { border-left: 2px solid var(--dg-border-strong); padding: 0.25rem 0 0.25rem 1rem; margin-top: 0.75rem; max-width: 78ch; font-size: 0.8125rem; color: var(--dg-text-muted); }
  .methodology code { font-family: var(--dg-font-mono); color: var(--dg-text); }
  .fail { border: 1px solid var(--dg-caveat); border-radius: 6px; padding: 1rem 1.25rem; margin-top: 1.5rem; max-width: 70ch; }
  @media (prefers-reduced-motion: no-preference) { .card { transition: border-color 120ms ease; } .card:hover { border-color: var(--dg-border-strong); } }
</style>
</head>
<body>
<div class="wrap">
  <p class="sub">Studio proposal 023 · descriptive, not decision-grade · every number regenerable — commands in the footer</p>
  <div id="root"><div class="fail" id="failbox" hidden></div></div>
</div>

<script type="module">
const root = document.getElementById("root");
const failbox = document.getElementById("failbox");
function fail(msg) {
  failbox.hidden = false;
  failbox.textContent = "This page failed to draw — not an empty result, a fault. " + msg +
    " Rebuild with: python3 tools/card-build.py, then reload.";
}
try {
  await import("./data.js?v=" + encodeURIComponent(document.lastModified));
  const D = window.DATA;
  if (!D || !D.cards || !D.cards.length) throw new Error("data.js loaded but carries no cards");
  render(D);
} catch (e) { fail(e.message); }

function el(tag, attrs = {}, ...kids) {
  const n = attrs.svg ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (k !== "svg" && v != null) n.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}
function fmtV(v) { return v == null ? "—" : v.toLocaleString("en-US"); }
function ordinal(n) {
  const t = n % 100;
  if (t >= 11 && t <= 13) return n + "th";
  return n + ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
}
function pctile(x) { return x == null ? "—" : ordinal(Math.round(x * 100)) + " pctile"; }

// One geometry, consulted by both the band mark and its caption so the two can never disagree.
// It is a FUNCTION, not a const, and that is load-bearing: render() is invoked at the top of this
// module, so every `const` written below that call sits in the temporal dead zone when it runs.
// Two faults today came from exactly that (022's `days`, this file's first draft). Only hoisted
// function declarations are safe here.
function bandGeom() { return { W: 400, m: { l: 6, r: 6, t: 20, b: 18 } }; }
function hasRoomForLow(c) {
  if (c.band_pct == null) return false;
  const g = bandGeom();
  return (g.W - g.m.l - g.m.r) * (c.band_pct / 100) > 84;
}

function render(D) {
  root.append(
    el("h1", {}, "The player card"),
    el("p", { class: "lede" },
      `One unit, six situations. Each card answers the same four questions about a player — what the market pays now, ` +
      `how far it has moved him, where our board stands against it, and what the same position costs free — so the ` +
      `card serves a cut, a hold, a trade target or a waiver claim without being rebuilt for each.`),
    el("div", { class: "retraction" },
      el("b", {}, "Retracted from yesterday's card: the “drift toward/away from our board” row. "),
      `Measured rather than assumed: our board changed on ${D.model.change_days.length} of ${D.model.capture_days} capture days ` +
      `(${D.model.change_days.join(", ")} — and the second was a 0.1-point twitch on two players), so it was never two lanes drifting, ` +
      `just the market moving against a fixed line. In percentile space it moved at noise scale: within-player spread 0.030 against ` +
      `0.167 across players. The row is gone. What replaces it is below, and it is the one factor here that is worth more every day ` +
      `the capture runs.`));

  root.append(el("h2", {}, "Six situations, one card"),
    el("p", { class: "sub" },
      `Bands are drawn on one shared axis — percent of each player's own highest captured price — so their widths compare across ` +
      `cards. Population bars computed from ${D.population.n} players with a price today and at least 30 captures: the typical band ` +
      `is ${D.population.band_p50}% wide, ${D.population.at_low_pct}% of players sit at their own low, ${D.population.at_high_pct}% at their own high.`));

  const reads = {
    "Mac Jones": c => `${fmtV(c.value_now)} today at QB${c.rank_now}, sitting on the floor of a band ${c.band_pct}% wide — ${c.band_vs_pop}. The wire settles it: ${c.wire.name} is unrostered at ${fmtV(c.wire.value)}, QB${c.wire.rank}. Your fourth quarterback is priced below a free one.`,
    "Dillon Gabriel": c => `${fmtV(c.high)} down to ${fmtV(c.value_now)} across the window — a ${c.band_pct}% band, ${c.band_vs_pop}. Our board still projects him at ${c.ppg_2y.toFixed(1)} fantasy points a game over the next two seasons and has not moved since June; it cannot see a camp.`,
    "Rasheen Ali": c => `Listed on ${c.priced_days} of ${D.capture_days} capture days, last at ${fmtV(c.series[c.series.length-1].v)}, and nothing since ${c.last_priced}. This is not a low price. It is no price — the distinction the card refuses to blur.`,
    "Garrett Wilson": c => `At his ${D.capture_days}-day low, and that means almost nothing: his band is ${c.band_pct}% wide — ${c.band_vs_pop}, against a typical ${D.population.band_p50}%. The market has not moved him. He has practised since 29 July after last season's knee injury, and our board carries no score for him at all.`,
    "Rome Odunze": c => `At his ${D.capture_days}-day high on a ${c.band_pct}% band — a real move inside a narrow one. Chicago traded DJ Moore to Buffalo this offseason and Odunze is the primary outside target; the price has followed the role, not a stat line.`,
    "Pat Bryant": c => `${fmtV(c.low)} to ${fmtV(c.value_now)} — top of a ${c.band_pct}% band, ${c.band_vs_pop}, and the widest upward band on the roster. Whatever the market is hearing out of camp, it has been hearing it for weeks.`,
  };

  const grid = el("div", { class: "cards" });
  for (const c of D.cards) grid.append(cardEl(c, reads[c.name]?.(c)));
  root.append(grid);

  function cardEl(c, read) {
    const card = el("article", { class: "card" });
    card.append(el("header", {},
      el("span", { class: "nm" }, c.name),
      el("span", { class: "pos " + c.pos }, c.pos),
      el("span", { class: "meta" }, [c.age ? "age " + Math.floor(c.age) : null,
        c.on_ir ? "on IR" : null, c.on_taxi ? "on taxi" : null].filter(Boolean).join(" · ")),
      el("span", { class: "case" }, c.case)));

    // ── the band: length = how far the market has moved him; dot = where he is now
    const bandRow = el("div", { class: "row band" });
    bandRow.append(el("div", { class: "label" },
      (c.priced_today ? `his own ${D.capture_days}-day band` : `his own band — no price since ${c.last_priced}`) +
      (c.band_pct != null ? ` · ${c.band_pct}% wide, ${c.band_vs_pop}` : "") +
      (c.band_pct != null && !hasRoomForLow(c) && !(c.priced_today && c.value_now === c.low)
        ? ` · low ${fmtV(c.low)}` : "")));
    bandRow.append(bandSvg(c));
    card.append(bandRow);

    // ── the two boards
    const b = el("div", { class: "row" });
    // Our lane is spoken in the hobby's own unit. DVS is that same number x a per-position
    // constant (measured 2026-08-17), so printing the score instead of the points is a choice
    // to be more abstract for no gain — the complaint David has made since 2026-07-15.
    b.append(el("div", { class: "label" }, `the two boards, among ${c.pos}s`
      + (c.ppg_2y != null ? ` · we project ${c.ppg_2y.toFixed(1)} PPG over two seasons` : " · we have no projection for him")));
    const line = el("div", { class: "boards" });
    if (c.model_pct == null || c.market_pct == null) {
      line.append(el("span", {}, `${c.model_pct == null ? "our board has no score for him" : "ours " + pctile(c.model_pct)} · ` +
        `${c.market_pct == null ? "market unpriced" : "market " + pctile(c.market_pct)}`));
    } else {
      line.append(el("span", { class: "lane-model" }, "ours " + pctile(c.model_pct)), el("span", {}, "vs"),
        el("span", { class: "lane-market" }, "market " + pctile(c.market_pct)), dumbbell(c));
    }
    b.append(line);
    card.append(b);

    // ── the wire
    const w = el("div", { class: "row" });
    w.append(el("div", { class: "label" }, "the wire"));
    w.append(el("div", { class: "wire" }, c.wire
      ? `best unrostered ${c.pos}: ${c.wire.name}, ${fmtV(c.wire.value)} (${c.pos}${c.wire.rank})`
      : `no unrostered ${c.pos} carries a price`));
    card.append(w);

    if (read) card.append(el("p", { class: "read" }, read));
    return card;
  }

  function bandSvg(c) {
    const g = bandGeom(), W = g.W, H = 62, m = g.m;
    const X = p => m.l + (W - m.l - m.r) * p;            // p = fraction of his own high
    const s = el("svg", { svg: 1, viewBox: `0 0 ${W} ${H}`, role: "img",
      "aria-label": c.priced_today
        ? `${c.name}: captured band from ${c.low} to ${c.high}, ${c.band_pct} percent wide, ${c.band_vs_pop}. Today ${c.value_now}, ${Math.round((c.own_pos||0)*100)} percent of the way up his own range.`
        : `${c.name}: no price since ${c.last_priced}. Last captured band ${c.low} to ${c.high}.` });
    // the axis: 0 to his own high, zero baseline never truncated
    s.append(el("line", { svg: 1, x1: X(0), y1: H - m.b, x2: X(1), y2: H - m.b, stroke: "var(--dg-border)", "stroke-width": 1 }));
    s.append(el("text", { svg: 1, x: X(0), y: H - 5, "text-anchor": "start", fill: "var(--dg-text-muted)",
      "font-size": "11", "font-family": "var(--dg-font-sans)" }, "0"));
    if (c.high) {
      const lo = c.low / c.high, now = c.value_now / c.high;
      // the band itself — its LENGTH is the quantity the normalised figure hides
      s.append(el("line", { svg: 1, x1: X(lo), y1: m.t + 8, x2: X(1), y2: m.t + 8,
        stroke: c.priced_today ? "var(--dg-market)" : "var(--dg-market-muted)", "stroke-width": 6, "stroke-linecap": "butt" }));
      // today
      if (c.priced_today) {
        s.append(el("circle", { svg: 1, cx: X(now), cy: m.t + 8, r: 6, fill: "var(--dg-market-emphasis)",
          stroke: "var(--dg-surface)", "stroke-width": 2 }));
        s.append(el("text", { svg: 1, x: X(now), y: m.t - 2, "text-anchor": now > 0.85 ? "end" : now < 0.15 ? "start" : "middle",
          fill: "var(--dg-text)", "font-size": "13", "font-family": "var(--dg-font-mono)", "font-weight": "600" }, fmtV(c.value_now)));
      } else {
        s.append(el("circle", { svg: 1, cx: X(now), cy: m.t + 8, r: 5, fill: "none",
          stroke: "var(--dg-market-muted)", "stroke-width": 2 }));
        s.append(el("text", { svg: 1, x: X(now), y: m.t - 2, "text-anchor": "middle", fill: "var(--dg-text-muted)",
          "font-size": "11", "font-family": "var(--dg-font-sans)" }, "last " + fmtV(c.value_now)));
      }
      // the band's ends, direct-laballed below their own ticks. The low label is drawn only
      // when the band is wide enough to hold it; on a narrow band the caption carries it,
      // because a label that lands on its neighbour is worse than one moved to prose.
      for (const [p, v] of [[lo, c.low], [1, c.high]])
        s.append(el("line", { svg: 1, x1: X(p), y1: H - m.b - 3, x2: X(p), y2: H - m.b + 3, stroke: "var(--dg-border-strong)" }));
      // An end label is dropped when today's dot already carries that number: one visual and one
      // number per quantity, never the same figure printed twice on one mark.
      if (hasRoomForLow(c) && !(c.priced_today && c.value_now === c.low))
        s.append(el("text", { svg: 1, x: X(lo), y: H - m.b + 13, "text-anchor": "middle", fill: "var(--dg-text-muted)",
          "font-size": "11", "font-family": "var(--dg-font-mono)" }, fmtV(c.low)));
      if (!(c.priced_today && c.value_now === c.high))
        s.append(el("text", { svg: 1, x: X(1), y: H - m.b + 13, "text-anchor": "end", fill: "var(--dg-text-muted)",
          "font-size": "11", "font-family": "var(--dg-font-mono)" }, fmtV(c.high)));
    }
    return s;
  }

  function dumbbell(c) {
    const W = 130, s = el("svg", { svg: 1, width: W, height: 12, viewBox: `0 0 ${W} 12`, "aria-hidden": "true" });
    const px = v => 5 + (W - 10) * v;                    // best on the RIGHT
    s.append(el("line", { svg: 1, x1: 5, y1: 6, x2: W - 5, y2: 6, stroke: "var(--dg-border)", "stroke-width": 2 }));
    s.append(el("line", { svg: 1, x1: px(c.market_pct), y1: 6, x2: px(c.model_pct), y2: 6, stroke: "var(--dg-border-strong)", "stroke-width": 2 }));
    s.append(el("circle", { svg: 1, cx: px(c.market_pct), cy: 6, r: 4, fill: "var(--dg-market)" }));
    s.append(el("circle", { svg: 1, cx: px(c.model_pct), cy: 6, r: 4, fill: "var(--dg-model)" }));
    return s;
  }

  root.append(el("h2", {}, "Methodology, limits, and how to re-run every number"),
    el("div", { class: "methodology" },
      el("p", {}, `The band is the app's own captured price history — ${D.capture_days} days, ${D.capture_start} → ${D.as_of}. ` +
        `It is emphatically not an all-time range: there is no obtainable market history before the capture began, so “his low” means ` +
        `his low since June, and the statement gets stronger every day rather than being true now. ` +
        `Our board's percentile is the model's, unchanged since ${D.model.last_material_change} — a standing opinion, not a stale number, ` +
        `but it has seen no football and the card says so instead of implying movement. ` +
        `Population bars recomputed on every build from the ${D.population.n} players with a price today and ≥30 captures.`),
      el("p", {}, "Rebuild: ", el("code", {}, "python3 tools/card-build.py"), " · the retraction's evidence: ",
        el("code", {}, "python3 tools/does-the-gap-path-carry-information.py"), " · serve: ",
        el("code", {}, "node tools/serve022.mjs"), " · data as of ", el("code", {}, D.as_of), ".")));
}
</script>
</body>
</html>
