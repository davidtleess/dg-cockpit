# Enable mouse support
set -g mouse on

# Fix colors — tmux-256color + Tc override enables 24-bit true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Use a better status bar color
set -g status-bg black
set -g status-fg colour136

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Focus events: Claude Code's input handling wedges without these
# (froze 4 sessions 2026-07-14/15). Takes effect on next dg rebuild.
set -g focus-events on

# Attention flags: a bell from any pane lights its window tab red in the
# status bar, so an agent waiting on approval is visible from any window
set -g bell-action any
set -g visual-bell off
setw -g monitor-bell on
set -g window-status-bell-style 'bg=colour196,fg=colour231,bold'

# Status-bar clicks, all four zones (2026-08-15, measured from David's real
# clicks): tabs select their window; the left badge, clock, and empty middle
# — where most clicks actually land — toggle to the other window. Before
# this, tab clicks ran a same-session no-op (`switch-client -t =`, origin
# unknown) and the other three zones were unbound: a bar that ignored almost
# every click it received.
bind-key -T root MouseDown1Status select-window -t =
bind-key -T root MouseDown1StatusLeft select-window -l
bind-key -T root MouseDown1StatusRight select-window -l
bind-key -T root MouseDown1StatusDefault select-window -l

